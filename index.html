<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRX_77 | Login</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, #0066ff55 0 2px, transparent 3px),
        radial-gradient(circle at 70% 30%, #168cff88 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, #0077ff66 0 2px, transparent 3px),
        radial-gradient(circle at 90% 70%, #009dff77 0 2px, transparent 3px),
        #030914;
    background-size: 180px 180px, 230px 230px, 270px 270px, 210px 210px;
}

/* النجوم */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(#168cff 1px, transparent 1px),
        radial-gradient(#65baff 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    animation: stars 18s linear infinite;
    opacity: .65;
    pointer-events: none;
}

@keyframes stars {
    from { transform: translateY(0); }
    to { transform: translateY(90px); }
}

.login-box {
    width: min(90%, 650px);
    padding: 42px;
    border-radius: 28px;
    background: rgba(10, 20, 34, .90);
    border: 1px solid #168cff55;
    box-shadow:
        0 0 35px #0077ff22,
        inset 0 0 30px #0077ff0d;
    position: relative;
    z-index: 2;
}

.logo {
    text-align: center;
    font-size: 38px;
    font-weight: 800;
    color: white;
    margin-bottom: 25px;
}

.logo span {
    color: #168cff;
}

.line {
    height: 1px;
    background: #ffffff20;
    margin-bottom: 35px;
}

.title {
    text-align: right;
    color: #aeb9ca;
    font-size: 21px;
    margin-bottom: 12px;
}

.input {
    width: 100%;
    height: 65px;
    border-radius: 17px;
    border: 1px solid #168cff66;
    background: #050b16;
    color: white;
    font-size: 20px;
    padding: 0 20px;
    outline: none;
    margin-bottom: 24px;
    direction: ltr;
}

.input:focus {
    border-color: #168cff;
    box-shadow: 0 0 18px #168cff33;
}

.login-btn {
    width: 100%;
    height: 68px;
    border: none;
    border-radius: 17px;
    background: linear-gradient(135deg, #006eff, #168cff);
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px #0077ff55;
    transition: .2s;
}

.login-btn:active {
    transform: scale(.98);
}

.message {
    text-align: center;
    min-height: 25px;
    margin-top: 18px;
    font-size: 16px;
}

.secure {
    text-align: center;
    color: #77869c;
    margin-top: 30px;
    font-size: 15px;
}

#password {
    direction: ltr;
}

@media(max-width:600px) {
    .login-box {
        padding: 28px 22px;
    }

    .logo {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        TRX <span>_77</span> ⚡
    </div>

    <div class="line"></div>

    <div class="title">اسم المستخدم:</div>

    <input
        class="input"
        type="text"
        value="TRX_77"
        readonly
    >

    <div class="title">كلمة المرور:</div>

    <input
        class="input"
        id="password"
        type="password"
        placeholder="أدخل كلمة المرور..."
    >

    <button class="login-btn" onclick="login()">
        تسجيل الدخول ▶
    </button>

    <div class="message" id="message"></div>

    <div class="secure">
        🔒 نظام دخول آمن ومشفر
    </div>

</div>

<script>
function login() {

    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    // غيّر كلمة المرور هنا
    const correctPassword = "123456";

    if (password === correctPassword) {

        message.style.color = "#38a8ff";
        message.textContent = "تم تسجيل الدخول بنجاح ✓";

        setTimeout(() => {
            window.location.href = "home.html";
        }, 700);

    } else {

        message.style.color = "#ff5577";
        message.textContent = "كلمة المرور غير صحيحة";
    }
}
</script>

</body>
</html>
