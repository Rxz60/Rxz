<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRX - Roblox Lua Shield</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
            color: #00363a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #stars-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        #mainApp {
            position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px;
        }
        .container {
            width: 100%; max-width: 860px; background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 20px 50px rgba(0, 131, 143, 0.15);
        }
        .header-brand { text-align: center; margin-bottom: 30px; }
        .header-brand .logo-text {
            font-size: 46px; font-weight: 900; letter-spacing: 8px; color: #006064;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }
        .header-brand .sub-text { font-size: 13px; color: #00838f; letter-spacing: 4px; font-weight: 600; }
        .rotating-snow {
            display: inline-block; font-size: 38px; animation: spinSnow 6s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.8)); margin-bottom: 10px;
        }
        @keyframes spinSnow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
        }
        h2 { text-align: center; margin-bottom: 25px; color: #004d40; font-size: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #006064; }
        textarea {
            width: 100%; height: 180px; background: rgba(255, 255, 255, 0.5); color: #004d40;
            border: 1px solid rgba(0, 151, 167, 0.3); border-radius: 14px; padding: 16px;
            font-family: monospace; font-size: 13px; resize: vertical; direction: ltr;
            text-align: left; outline: none; transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }
        textarea:focus { border-color: #00838f; background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        .btn-container { text-align: center; margin: 25px 0; }
        button {
            background: linear-gradient(135deg, #00acc1, #00838f); color: #ffffff;
            font-weight: 800; font-size: 16px; border: none; border-radius: 14px;
            cursor: pointer; transition: all 0.3s ease; padding: 14px 38px; letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 131, 143, 0.3);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 188, 212, 0.5); background: linear-gradient(135deg, #00bcd4, #00acc1); }
        .copy-btn {
            background: rgba(0, 131, 143, 0.15); color: #004d40; font-size: 14px;
            padding: 10px 22px; margin-top: 14px; float: left; border-radius: 10px; font-weight: 700;
        }
        .copy-btn:hover { background: rgba(0, 131, 143, 0.25); box-shadow: none; color: #00251a; }
        .status-badge { text-align: center; font-size: 12px; color: #006064; margin-top: 25px; letter-spacing: 2px; font-weight: 600; clear: both; }
        .key-box { margin-bottom: 20px; background: rgba(255, 255, 255, 0.3); padding: 15px; border-radius: 14px; border: 1px solid rgba(0, 151, 167, 0.2); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .key-input { flex: 1; padding: 10px; background: rgba(255,255,255,0.6); border: 1px solid rgba(0,151,167,0.3); border-radius: 8px; font-family: monospace; color: #004d40; font-size: 13px; text-align: center; direction: ltr; outline: none; }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    <div id="mainApp">
        <div class="container">
            <div class="header-brand">
                <div class="rotating-snow">❄️</div>
                <div class="logo-text">MRX</div>
                <div class="sub-text">ICE SHIELD OBFUSCATOR</div>
            </div>
            <h2>⎜ أداة حماية وتشفير سكربتات لوا الفائقة ⎜</h2>
            
            <div class="key-box">
                <input type="text" class="key-input" id="generatedKey" readonly placeholder="اضغط توليد مفتاح حماية">
                <button onclick="generateKey()" style="padding: 10px 20px; font-size: 13px; margin: 0;">🔑 توليد مفتاح</button>
            </div>

            <label for="inputLua">أدخل كود Lua الأصلي هنا:</label>
            <textarea id="inputLua" placeholder='print("Ice Shield Active")'></textarea>
            
            <div class="btn-container">
                <button onclick="obfuscateScript()">🔒 تشفير السكربت بـ 7 طبقات ثلجية</button>
            </div>
            
            <label for="outputLua">الكود المشفر (جاهز للاستخدام):</label>
            <textarea id="outputLua" readonly placeholder="السكربت المشفر سيظهر هنا..."></textarea>
            
            <div style="text-align: left;">
                <button class="copy-btn" onclick="copyOutput()">📋 نسخ السكربت المشفر</button>
            </div>
            
            <div class="status-badge">MRX ICE SHIELD ACTIVE ● MAXIMUM PROTECTION LEVEL 7</div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 180; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1, speed: Math.random() * 0.8 + 0.3,
                opacity: Math.random() * 0.7 + 0.3, type: Math.random() > 0.5 ? 'snow' : 'bubble'
            });
        }
        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of particles) {
                p.y += p.speed;
                if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }
                ctx.beginPath();
                if (p.type === 'snow') {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                } else {
                    ctx.arc(p.x, p.y, p.size * 1.2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(224, 247, 250, ${p.opacity * 0.8})`;
                }
                ctx.fill();
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();
        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = 'MRX-ICE-';
            for (let i = 0; i < 4; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
            key += '-';
            for (let i = 0; i < 4; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('generatedKey').value = key;
        }
        function obfuscateScript() {
            const rawCode = document.getElementById('inputLua').value;
            if (!rawCode.trim()) return;
            const bytes = [];
            for (let i = 0; i < rawCode.length; i++) bytes.push(rawCode.charCodeAt(i));
            const k1 = Math.floor(Math.random() * 150) + 20;
            const k2 = Math.floor(Math.random() * 130) + 30;
            const l1 = bytes.map(b => b ^ k1);
            const l2 = l1.map(b => b ^ k2);
            const ord = [];
            const dat = [];
            const idx = [];
            for (let i = 0; i < l2.length; i++) idx.push(i);
            for (let i = idx.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [idx[i], idx[j]] = [idx[j], idx[i]];
            }
            for (let i = 0; i < l2.length; i++) {
                dat.push(l2[idx[i]]);
                ord.push(idx[i]);
            }
            document.getElementById('outputLua').value = `local _K1=${k1} local _K2=${k2} local _O={${ord.join(',')}} local _D={${dat.join(',')}} local _L=#_D local _R={} for _i=1,_L do _R[_O[_i]+1]=_D[_i] end local _B=bit32 or bit for _i=1,_L do local v=_R[_i] v=_B.bxor(v,_K2) v=_B.bxor(v,_K1) _R[_i]=v end local _C={} for _i=1,_L do _C[_i]=string.char(_R[_i]) end local _F=(loadstring or load)(table.concat(_C)) if _F then return _F() end`;
        }
        function copyOutput() {
            const output = document.getElementById('outputLua');
            if (!output.value.trim()) return;
            output.select(); output.setSelectionRange(0, 99999);
            document.execCommand('copy');
        }
    </script>
</body>
</html>
