
<!DOCTYPE html>

<meta name="theme-color" content="#000000">
<title>MRX</title>
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
min-height: 100vh;
background: #000;
color: #fff;
font-family: Arial, sans-serif;
display: flex;
align-items: center;

main {

}

.status {
font-size: 14px;

@keyframes blink {

}
50% {
opacity: 0;
text-shadow: none;
}
}
