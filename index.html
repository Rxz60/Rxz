<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRX - Roblox Lua تشفير </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
            color: #00363a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #snow-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        #mainApp {
            position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px;
        }
        .container {
            width: 100%; max-width: 860px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0, 131, 143, 0.15);
        }
        .header-brand { text-align: center; margin-bottom: 30px; }
        .logo-svg {
            width: 50px; height: 50px;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.8));
            animation: spinIce 8s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spinIce {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .header-brand .logo-text {
            font-size: 46px; font-weight: 900; letter-spacing: 8px; color: #006064;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }
        .header-brand .sub-text { font-size: 13px; color: #00838f; letter-spacing: 4px; font-weight: 600; }
        h2 { text-align: center; margin-bottom: 25px; color: #004d40; font-size: 22px; }
        
        .label-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        label { font-weight: 700; font-size: 14px; color: #006064; }
        
        .upload-btn-small {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(0, 151, 167, 0.2); color: #004d40;
            padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
            cursor: pointer; border: 1px solid rgba(0, 151, 167, 0.3);
            transition: all 0.25s ease;
        }
        .upload-btn-small:hover {
            background: rgba(0, 151, 167, 0.35); transform: translateY(-1px);
        }
        
        textarea {
            width: 100%; height: 180px; background: rgba(255, 255, 255, 0.5); color: #004d40;
            border: 1px solid rgba(0, 151, 167, 0.3); border-radius: 14px; padding: 16px;
            font-family: monospace; font-size: 13px; resize: vertical; direction: ltr;
            text-align: left; outline: none; transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }
        textarea:focus { border-color: #00838f; background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        
        .btn-container { text-align: center; margin: 25px 0; }
        .encrypt-btn {
            background: linear-gradient(135deg, #00acc1, #00838f); color: #ffffff;
            font-weight: 800; font-size: 16px; border: none; border-radius: 14px;
            cursor: pointer; transition: all 0.3s ease; padding: 14px 38px; letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 131, 143, 0.3);
            display: inline-flex; align-items: center; gap: 10px;
        }
        .encrypt-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 188, 212, 0.5); background: linear-gradient(135deg, #00bcd4, #00acc1); }
        
        .action-bar {
            display: flex; gap: 12px; margin-top: 14px;
        }
        .action-btn {
            background: rgba(0, 131, 143, 0.18); color: #004d40; font-size: 13px;
            padding: 10px 20px; border-radius: 10px; font-weight: 700; border: none;
            cursor: pointer; transition: all 0.25s ease;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .action-btn:hover { background: rgba(0, 131, 143, 0.3); color: #00251a; transform: translateY(-2px); }
        
        .status-badge { text-align: center; font-size: 12px; color: #006064; margin-top: 25px; letter-spacing: 2px; font-weight: 600; }
        
        svg { fill: currentColor; }
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    <div id="mainApp">
        <div class="container">
            <div class="header-brand">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M12,2 L14,7 L19,4 L16,9 L22,12 L16,15 L19,20 L14,17 L12,22 L10,17 L5,20 L8,15 L2,12 L8,9 L5,4 L10,7 Z"/>
                </svg>
                <div class="logo-text">MRX</div>
                <div class="sub-text">ICE SHIELD OBFUSCATOR</div>
            </div>
            
            <h2>⎜ أداة تشفير وحماية سكربتات لوا الفائقة ⎜</h2>
            
            <div class="label-row">
                <label for="inputLua">أدخل كود Lua الأصلي هنا:</label>
                <label class="upload-btn-small">
                    <svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                    رفع ملف
                    <input type="file" id="fileLoader" accept=".lua,.txt" onchange="loadFile(event)" style="display:none;">
                </label>
            </div>
            
            <textarea id="inputLua" placeholder='print("Ice Shield Active")'></textarea>
            
            <div class="btn-container">
                <button class="encrypt-btn" onclick="obfuscateScript()">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    تشفير السكربت بـ 7 طبقات ثلجية
                </button>
            </div>
            
            <label for="outputLua">الكود المشفر (جاهز للاستخدام):</label>
            <textarea id="outputLua" readonly placeholder="السكربت المشفر سيظهر هنا..."></textarea>
            
            <div class="action-bar">
                <button class="action-btn" onclick="copyOutput()">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    نسخ السكربت المشفر
                </button>
                <button class="action-btn" onclick="downloadOutput()">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    تحميل التشفير (.lua)
                </button>
            </div>
            
            <div class="status-badge">MRX ICE SHIELD ACTIVE ● MAXIMUM PROTECTION LEVEL 7</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 160; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speed: Math.random() * 0.7 + 0.3,
                opacity: Math.random() * 0.7 + 0.3,
                type: Math.random() > 0.5 ? 'snow' : 'bubble'
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of particles) {
                p.y += p.speed;
                if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }
                ctx.beginPath();
                if (p.type === 'snow') {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                } else {
                    ctx.arc(p.x, p.y, p.size * 1.3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(224, 247, 250, ${p.opacity * 0.7})`;
                }
                ctx.fill();
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = function(evt) { document.getElementById('inputLua').value = evt.target.result; };
            r.readAsText(file);
        }

        function obfuscateScript() {
            const rawCode = document.getElementById('inputLua').value;
            if (!rawCode.trim()) return;
            const bytes = [];
            for (let i = 0; i < rawCode.length; i++) bytes.push(rawCode.charCodeAt(i));
            const k1 = Math.floor(Math.random() * 150) + 20;
            const k2 = Math.floor(Math.random() * 130) + 30;
            const l1 = bytes.map(b => b ^ k1);
            const l2 = l1.map(b => b ^ k2);
            const ord = [];
            const dat = [];
            const idx = [];
            for (let i = 0; i < l2.length; i++) idx.push(i);
            for (let i = idx.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [idx[i], idx[j]] = [idx[j], idx[i]];
            }
            for (let i = 0; i < l2.length; i++) {
                dat.push(l2[idx[i]]);
                ord.push(idx[i]);
            }
            document.getElementById('outputLua').value = `local _K1=${k1} local _K2=${k2} local _O={${ord.join(',')}} local _D={${dat.join(',')}} local _L=#_D local _R={} for _i=1,_L do _R[_O[_i]+1]=_D[_i] end local _B=bit32 or bit for _i=1,_L do local v=_R[_i] v=_B.bxor(v,_K2) v=_B.bxor(v,_K1) _R[_i]=v end local _C={} for _i=1,_L do _C[_i]=string.char(_R[_i]) end local _F=(loadstring or load)(table.concat(_C)) if _F then return _F() end`;
        }

        function copyOutput() {
            const output = document.getElementById('outputLua');
            if (!output.value.trim()) return;
            output.select(); output.setSelectionRange(0, 99999);
            document.execCommand('copy');
        }

        function downloadOutput() {
            const val = document.getElementById('outputLua').value;
            if (!val.trim()) return;
            const blob = new Blob([val], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'MRX_Protected.lua';
            a.click();
        }
    </script>
</body>
</html>
