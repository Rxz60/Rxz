<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRX - Secure Lua Repository</title>
    <style>
        
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0a;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #ffffff;
            --btn-primary: #1a1a1a;
            --btn-hover: #333333;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);

            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.9)), url('https://cdn.phototourl.com/member/2026-10-16-00942eac-c25d-4c32-ab3b-9c27ac3a64f9.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

     
        #login-screen {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        h1.logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: 2px;
            font-weight: 300;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        input[type="password"], textarea, input[type="url"] {
            background-color: #000000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: monospace;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        button {
            background-color: var(--btn-primary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--btn-hover);
            border-color: var(--text-muted);
        }

    
        #dashboard {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .section-title {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--text-main);
        }

        .script-item {
            background: #000000;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-link {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            margin-right: 10px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            width: auto;
            font-size: 0.8rem;
        }

        
        .webhook-config {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .hidden {
            display: none !important;
        }


        #raw-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            color: var(--text-main);
            padding: 20px;
            box-sizing: border-box;
        }
        
        .raw-content {
            max-width: 600px;
            text-align: center;
        }

        .raw-status {
            font-size: 3rem;
            color: #ff4444;
            margin-bottom: 20px;
        }

        .raw-json {
            background: #111;
            padding: 20px;
            border: 1px solid #333;
            text-align: left;
            white-space: pre-wrap;
            color: #ccc;
        }

    </style>
</head>
<body>


    <div id="login-screen" class="container">
        <h1 class="logo">TRX REPO</h1>
        <p class="subtitle">Secure Lua Script Repository</p>
        
        <input type="password" id="password-input" placeholder="Enter Access Key">
        <button onclick="attemptLogin()">SLOG IN</button>
        <p id="login-error" style="color: #ff4444; display: none; margin-top: 10px;">Access Denied</p>
    </div>


    <div id="dashboard" class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 class="section-title" style="margin:0; border:none;">Script Generator</h2>
            <button onclick="logout()" style="width: auto; padding: 5px 15px; margin:0;">Logout</button>
        </div>

        <textarea id="lua-code" rows="6" placeholder="-- Paste your Lua code here..."></textarea>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem;">Or Upload File:</label>
            <input type="file" id="file-upload" onchange="handleFileUpload(this)">
        </div>

        <button onclick="generateScript()">CREATE SCRIPT</button>

        
        <div class="webhook-config">
            <h3 class="section-title">Saved Scripts</h3>
            <div id="scripts-list">
                
            </div>

            
            <div style="margin-top: 20px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem;">Webhook URL (for alerts):</label>
                <input type="url" id="webhook-url" placeholder="https://discord.com/api/webhooks/..." value="">
                <button onclick="saveWebhook()" style="width: auto; padding: 5px 15px; margin-top: 5px;">Save Webhook</button>
            </div>
        </div>
    </div>

    
    <div id="raw-viewer">
        <div class="raw-content">
            <div class="raw-status">404</div>
            <div class="raw-json">{
  "success": false,
  "status": 404,
  "message": "Page Not Found",
  "access": "Restricted",
  "error": "Resource Unavailable"
}</div>
            <p style="margin-top: 20px; color: #666; font-size: 0.8rem;">Resource unavailable or deleted.</p>
            <button onclick="closeRawViewer()" style="margin-top: 20px; width: auto;">Close</button>
        </div>
    </div>

    <script>

        const SECRET_KEY = "k404";
        

        const encryptionKeys = [
            "hndr_19c7cb11f032a369389d2e0e0cea58b41c80",
            "wgpt_5b117a74f34317dd35ef91b5d6cdd4167440c80fcffd92a7sk-proj-RvMqdEi8IL09G287ROm0Mjb2tXtPm0W23MCJLh2_92xjhG3gCXtBjZ_A_4lEnrHnCID3Dma0jwT3BlbkFJDPSGyUG3Jk-fbYBWptxivZvupJ2qcbGlAIrZUqq4Ca9kvIS7QjdC2GHddRZTWAk35HTFz5pJEA",
            "Tpdik0fwn42cVPAOgt4IjGS7aedqUJQaJwsu_MbhV7o",
            "DhP9vrQq01m1V0knvdNriU6wtkpIXvsE_UH-vbwIq10"
        ];

        const apiEndpoint = "POST /api/v1/keys\nContent-Type: application/json\n{\n  \"value\": \"my-site-secret\",\n  \"level\": \"strong\"\n}";

        let currentWebhookUrl = localStorage.getItem('trx_webhook') || "";
        let scripts = JSON.parse(localStorage.getItem('trx_scripts')) || [];

  
        window.onload = function() {
            if (document.getElementById('webhook-url')) {
                document.getElementById('webhook-url').value = currentWebhookUrl;
            }
            renderScripts();
        };


        function attemptLogin() {
            const input = document.getElementById('password-input').value;
            if (input === SECRET_KEY) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                sendAlert("User logged in successfully.");
            } else {
                document.getElementById('login-error').style.display = 'block';
                sendAlert("Failed login attempt.");
            }
        }

        function logout() {
            location.reload();
        }

  
        function handleFileUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('lua-code').value = e.target.result;
                };
                reader.readAsText(file);
            }
        }

        
        function generateScript() {
            const code = document.getElementById('lua-code').value;
            if (!code.trim()) {
                alert("Please enter some Lua code or upload a file.");
                return;
            }

            
            const scriptId = Math.random().toString(36).substring(2, 15);
            const rawLink = `${window.location.origin}/raw/${scriptId}`;
            
         
            const newScript = {
                id: scriptId,
                link: rawLink,
                date: new Date().toLocaleString()
            };
            
            scripts.unshift(newScript);
            localStorage.setItem('trx_scripts', JSON.stringify(scripts));
            renderScripts();
            
            // Simulate sending keys to API
            console.log(`Sending keys: ${encryptionKeys.join(', ')}`);
            console.log(`API Endpoint: ${apiEndpoint}`);
            
            alert("Script Created! Copy the Raw Link below.");
            sendAlert(`New script created: ${rawLink}`);
        }


        function renderScripts() {
            const listContainer = document.getElementById('scripts-list');
            listContainer.innerHTML = '';

            scripts.forEach(script => {
                const div = document.createElement('div');
                div.className = 'script-item';
                div.innerHTML = `
                    <div>
                        <div style="color: #fff; font-size: 0.9rem; margin-bottom: 5px;">ID: ${script.id}</div>
                        <div class="script-link">${script.link}</div>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('${script.link}')">Copy Raw</button>
                `;
                listContainer.appendChild(div);
            });
        }


        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Raw Link Copied!");
            });
        }


        function saveWebhook() {
            const url = document.getElementById('webhook-url').value;
            if (url) {
                localStorage.setItem('trx_webhook', url);
                currentWebhookUrl = url;
                alert("Webhook URL Saved!");
            }
        }

        function sendAlert(message) {
            if (currentWebhookUrl) {
                fetch(currentWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔒 TRX Security Alert:\n${message}\n\nTime: ${new Date().toISOString()}\nUser Agent: ${navigator.userAgent}`
                    })
                }).catch(err => console.error("Webhook error:", err));
            }
        }

 
        function openRawViewer() {
            document.getElementById('raw-viewer').style.display = 'flex';
        }

        function closeRawViewer() {
            document.getElementById('raw-viewer').style.display = 'none';
        }

     
        if (window.location.pathname.startsWith('/raw/')) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            openRawViewer();
            sendAlert(`Someone accessed raw link: ${window.location.pathname}`);
        }

    </script>
</body>
</html>
