<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRX_77 | My companion AI-Fa</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#070d18;
    color:#d9dee8;
    font-family:Arial,Tahoma,sans-serif;
    overflow-x:hidden;
}

/* خلفية النجوم */
body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
      radial-gradient(circle at 10% 20%,#087cff 1px,transparent 2px),
      radial-gradient(circle at 35% 70%,#168cff 1px,transparent 2px),
      radial-gradient(circle at 75% 25%,#42aaff 1px,transparent 2px),
      radial-gradient(circle at 90% 80%,#087cff 1px,transparent 2px),
      radial-gradient(circle at 55% 45%,#168cff 1px,transparent 2px);
    background-size:90px 90px,130px 130px,170px 170px,110px 110px,200px 200px;
    animation:stars 18s linear infinite;
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 50% 0%,#006eff18,transparent 45%),
      radial-gradient(circle at 50% 100%,#006eff10,transparent 50%);
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(90px)}
}

/* الصفحات */
.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.hidden{display:none!important}

/* تسجيل الدخول */
.login-box{
    width:min(92%,520px);
    background:#111923eF;
    border:1px solid #34404f;
    border-radius:26px;
    padding:35px;
    box-shadow:0 0 35px #006eff18;
}

.logo{
    text-align:center;
    color:#f1f5fa;
    font-size:36px;
    font-weight:800;
}

.logo span{color:#168cff}

.divider{
    height:1px;
    background:#ffffff18;
    margin:25px 0 30px;
}

.label{
    display:block;
    margin:15px 0 10px;
    color:#aeb7c5;
    font-size:18px;
}

.input{
    width:100%;
    height:62px;
    border-radius:15px;
    border:1px solid #343d49;
    background:#080d17;
    color:#fff;
    padding:0 18px;
    font-size:18px;
    outline:none;
}

.input:focus{
    border-color:#168cff;
    box-shadow:0 0 15px #168cff22;
}

.btn{
    width:100%;
    height:62px;
    border:0;
    border-radius:15px;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn:active{transform:scale(.98)}

.login-btn{
    margin-top:22px;
    background:#087dff;
    box-shadow:0 0 20px #087dff35;
}

.error{
    min-height:24px;
    text-align:center;
    color:#ff687b;
    margin-top:15px;
}

/* الواجهة الرئيسية */
.main-page{
    min-height:100vh;
    padding:55px 15px;
}

.panel{
    width:min(94%,750px);
    margin:auto;
    background:#141c26f2;
    border:1px solid #35404d;
    border-radius:24px;
    padding:40px 50px;
    box-shadow:
      0 20px 50px #00000035,
      0 0 30px #006eff0b;
}

.header{
    text-align:center;
    font-size:39px;
    font-weight:800;
    color:#f1f4f8;
}

.header .terminal{
    color:#4c9dff;
}

.line{
    height:1px;
    background:#ffffff1b;
    margin:27px 0 40px;
}

.section-title{
    color:#aeb6c3;
    font-size:21px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:260px;
    resize:vertical;
    background:#080d17;
    border:2px solid #303844;
    border-radius:15px;
    color:#e9edf3;
    padding:24px;
    font-size:18px;
    outline:none;
    direction:rtl;
}

textarea:focus{
    border-color:#168cff;
    box-shadow:0 0 18px #168cff18;
}

textarea::placeholder{
    color:#b3b7bd;
    opacity:.75;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin:25px 0 45px;
}

.encrypt{
    background:#168c35;
    box-shadow:0 0 18px #168c3520;
}

.copy{
    background:#202631;
    border:1px solid #39414d;
}

.key-area{
    margin-top:20px;
}

.security{
    text-align:center;
    color:#9ba5b3;
    font-size:16px;
    margin-top:30px;
}

.status{
    text-align:center;
    min-height:25px;
    margin-top:15px;
    color:#5aa8ff;
}

@media(max-width:600px){
    .panel{padding:30px 18px}
    .header{font-size:30px}
    .actions{grid-template-columns:1fr}
    textarea{height:230px}
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<section id="loginPage" class="page">

<div class="login-box">

    <div class="logo">
        My companion AI-Fa <span>〉_</span>
    </div>

    <div class="divider"></div>

    <label class="label">اسم المستخدم:</label>

    <input
        class="input"
        value="TRX_77"
        readonly
    >

    <label class="label">كلمة المرور:</label>

    <input
        id="loginPassword"
        class="input"
        type="password"
        placeholder="أدخل كلمة المرور..."
    >

    <button class="btn login-btn" onclick="login()">
        تسجيل الدخول ▶
    </button>

    <div id="loginError" class="error"></div>

</div>

</section>


<!-- الواجهة الرئيسية -->
<section id="mainPage" class="main-page hidden">

<div class="panel">

    <div class="header">
        My companion AI-Fa
        <span class="terminal">〉_</span>
    </div>

    <div class="line"></div>

    <div class="section-title">
        &lt;/&gt; النص / السكربت الأصلي:
    </div>

    <textarea
        id="original"
        placeholder="ضع السكربت هنا ..."
    ></textarea>


    <div class="actions">

        <button class="btn encrypt" onclick="encryptText()">
            تشغيل التشفير ▶
        </button>

        <button class="btn copy" onclick="copyResult()">
            نسخ النتيجة 📋
        </button>

    </div>


    <div class="section-title">
        🔒 السكربت المشفر:
    </div>

    <textarea
        id="result"
        readonly
        placeholder="ستظهر النتيجة هنا ..."
    ></textarea>


    <div class="key-area">

        <div class="section-title">
            🔑 مفتاح التشفير:
        </div>

        <input
            id="cryptoPassword"
            class="input"
            type="password"
            placeholder="أدخل مفتاح التشفير..."
        >

    </div>

    <div id="status" class="status"></div>

    <div class="security">
        🛡️ الأداة جاهزة للتشفير
    </div>

</div>

</section>


<script>

/* =========================
   إعدادات تسجيل الدخول
   ========================= */

const USERNAME = "TRX_77";
const LOGIN_PASSWORD = "123456";

function login(){

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("loginError");

    if(password !== LOGIN_PASSWORD){

        error.textContent =
            "كلمة المرور غير صحيحة";

        return;
    }

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("mainPage")
        .classList.remove("hidden");
}


/* =========================
   AES-256-GCM
   ========================= */

const encoder = new TextEncoder();

function toBase64(bytes){

    let binary = "";

    for(let i = 0; i < bytes.length; i++){
        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}


async function deriveKey(password, salt){

    const material =
        await crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

    return crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:150000,
            hash:"SHA-256"
        },
        material,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        ["encrypt","decrypt"]
    );
}


/* تشفير النص */

async function encryptText(){

    const original =
        document.getElementById("original").value;

    const password =
        document.getElementById("cryptoPassword").value;

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    if(!original.trim()){

        status.textContent =
            "اكتب النص أو السكربت أولاً.";

        return;
    }

    if(password.length < 8){

        status.textContent =
            "مفتاح التشفير يجب أن يكون 8 أحرف على الأقل.";

        return;
    }

    status.textContent =
        "جاري تشفير النص...";

    try{

        /*
         * Salt عشوائي لكل عملية
         */
        const salt =
            crypto.getRandomValues(
                new Uint8Array(16)
            );

        /*
         * IV عشوائي
         */
        const iv =
            crypto.getRandomValues(
                new Uint8Array(12)
            );

        const key =
            await deriveKey(password,salt);

        const encrypted =
            await crypto.subtle.encrypt(
                {
                    name:"AES-GCM",
                    iv:iv
                },
                key,
                encoder.encode(original)
            );

        /*
         * نحفظ salt + iv + ciphertext
         * داخل JSON واحد حتى يمكن فك التشفير لاحقاً.
         */

        const encryptedBytes =
            new Uint8Array(encrypted);

        const packageData = {

            version:1,

            algorithm:"AES-256-GCM",

            kdf:"PBKDF2-SHA256",

            iterations:150000,

            salt:toBase64(salt),

            iv:toBase64(iv),

            data:toBase64(encryptedBytes)
        };

        result.value =
            JSON.stringify(packageData,null,2);

        status.textContent =
            "تم التشفير بنجاح ✓";

    }catch(error){

        console.error(error);

        status.textContent =
            "حدث خطأ أثناء التشفير.";
    }
}


/* نسخ النتيجة */

async function copyResult(){

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    if(!result.value){

        status.textContent =
            "لا توجد نتيجة لنسخها.";

        return;
    }

    try{

        await navigator.clipboard.writeText(
            result.value
        );

        status.textContent =
            "تم نسخ النتيجة ✓";

    }catch{

        result.select();
        document.execCommand("copy");

        status.textContent =
            "تم نسخ النتيجة ✓";
    }
}


/* Enter في تسجيل الدخول */

document
.getElementById("loginPassword")
.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        login();
    }

});

</script>

</body>
</html>
