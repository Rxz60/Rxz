<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS Tool - Purple Edition</title>
    <style>
        
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f0518; 
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
            animation: pulse 4s infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(75, 0, 130, 0.3) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        
        .container {
            background: rgba(25, 10, 40, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(138, 43, 226, 0.5);
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2), inset 0 0 20px rgba(138, 43, 226, 0.1);
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #d4a5ff;
            margin-bottom: 20px;
            font-weight: 900;
            text-shadow: 0 0 10px #8a2be2;
            letter-spacing: 1px;
        }

        label {
            display: block;
            text-align: right;
            margin-bottom: 8px;
            color: #bfaaff;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #5e2a84;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #bf55ff;
            box-shadow: 0 0 10px rgba(191, 85, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #8a2be2, #9932cc);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.6);
            background: linear-gradient(45deg, #9932cc, #ba55ff);
        }

        button:active {
            transform: translateY(1px);
        }

        
        .status-bar {
            margin-top: 20px;
            height: 6px;
            background: #1a0b2e;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8a2be2, #ff00ff);
            box-shadow: 0 0 10px #ff00ff;
            transition: width 0.1s linear;
        }

        .log-area {
            margin-top: 15px;
            height: 80px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            padding: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 0.8rem;
            color: #00ffaa;
            overflow-y: auto;
            direction: ltr;
            border: 1px solid #333;
        }

        .ip-display {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <h1>⚡ DDoS Attack ⚡</h1>
        
        <label for="targetInput">أدخل الرابط أو الـ IP</label>
        <input type="text" id="targetInput" placeholder="example.com or 1.1.1.1">
        
        <button onclick="startAttack()">بدء الهجوم</button>

        <div class="status-bar" id="statusBar">
            <div class="progress" id="progressBar"></div>
        </div>
        
        <div class="log-area" id="logs"></div>
        <div class="ip-display" id="ipDisplay"></div>
    </div>

    <script>
        let isAttacking = false;

        function log(msg) {
            const logs = document.getElementById('logs');
            const p = document.createElement('p');
            p.innerText = `> ${msg}`;
            logs.appendChild(p);
            logs.scrollTop = logs.scrollHeight;
        }

        function startAttack() {
            if (isAttacking) return;
            
            const target = document.getElementById('targetInput').value.trim();
            if (!target) {
                alert("الرجاء إدخال الرابط أو الـ IP أولاً");
                return;
            }

   
            document.getElementById('logs').innerHTML = '';
            document.getElementById('statusBar').style.display = 'block';
            document.getElementById('ipDisplay').innerText = `Target: ${target}`;
            
            isAttacking = true;
            const btn = document.querySelector('button');
            btn.innerText = "جاري الهجوم...";
            btn.style.background = "#333";
            
            let progress = 0;
            const bar = document.getElementById('progressBar');
            
     
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress > 100) progress = 100;
                
                bar.style.width = progress + '%';
                
                const actions = [
                    "Sending SYN packets...",
                    "UDP Flood initiated...",
                    "Bypassing firewall...",
                    "Connecting to proxy network...",
                    "Payload sent: " + Math.floor(Math.random() * 9999) + "KB",
                    "Requesting handshake..."
                ];
                
                if (Math.random() > 0.7) {
                    log(actions[Math.floor(Math.random() * actions.length)]);
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    isAttacking = false;
                    btn.innerText = "انتهى الهجوم ✅";
                    log("Attack completed successfully!");
                    
                    setTimeout(() => {
                        btn.style.background = "linear-gradient(45deg, #8a2be2, #9932cc)";
                        document.getElementById('statusBar').style.display = 'none';
                        bar.style.width = '0%';
                    }, 3000);
                }
            }, 100);
        }
    </script>
</body>
</html>
