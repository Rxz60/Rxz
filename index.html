<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRX VIP HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Tajawal', sans-serif;
user-select: none;
}
body {
background: #030712;
color: #f3f4f6;
min-height: 100vh;
overflow-x: hidden;
position: relative;
}
body::before {
content: '';
position: fixed;
top: -20%;
left: -10%;
width: 600px;
height: 600px;
background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(3, 7, 18, 0) 70%);
z-index: 0;
pointer-events: none;
}
body::after {
content: '';
position: fixed;
bottom: -20%;
right: -10%;
width: 600px;
height: 600px;
background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(3, 7, 18, 0) 70%);
z-index: 0;
pointer-events: none;
}
.container {
max-width: 1200px;
margin: 0 auto;
padding: 20px;
position: relative;
z-index: 1;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 0;
border-bottom: 1px solid rgba(14, 165, 233, 0.2);
margin-bottom: 30px;
}
.logo-box {
display: flex;
align-items: center;
gap: 12px;
}
.logo-icon {
width: 45px;
height: 45px;
background: linear-gradient(135deg, #0ea5e9, #2563eb);
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
}
.logo-text {
font-size: 28px;
font-weight: 900;
background: linear-gradient(90deg, #38bdf8, #818cf8);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: 1px;
}
.badge {
background: rgba(14, 165, 233, 0.15);
border: 1px solid #0ea5e9;
color: #38bdf8;
padding: 4px 12px;
border-radius: 20px;
font-size: 12px;
font-weight: 700;
}
.hero {
text-align: center;
padding: 40px 20px;
background: rgba(15, 23, 42, 0.6);
backdrop-filter: blur(12px);
border: 1px solid rgba(56, 189, 248, 0.2);
border-radius: 24px;
margin-bottom: 40px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.hero h1 {
font-size: 36px;
margin-bottom: 12px;
color: #ffffff;
text-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
}
.hero p {
color: #94a3b8;
font-size: 16px;
max-width: 600px;
margin: 0 auto 30px;
}
.search-box-wrapper {
position: relative;
max-width: 700px;
margin: 0 auto;
}
.search-box {
display: flex;
gap: 10px;
background: rgba(30, 41, 59, 0.8);
padding: 8px;
border-radius: 16px;
border: 1px solid rgba(56, 189, 248, 0.3);
transition: 0.3s;
}
.search-box:focus-within {
border-color: #38bdf8;
box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}
.search-input {
flex: 1;
background: transparent;
border: none;
padding: 12px 16px;
color: #fff;
font-size: 16px;
outline: none;
}
.btn {
background: linear-gradient(135deg, #0284c7, #2563eb);
color: #fff;
border: none;
padding: 12px 24px;
border-radius: 12px;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
gap: 8px;
transition: 0.3s;
box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
}
.btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
}
.btn-secondary {
background: rgba(30, 41, 59, 0.8);
border: 1px solid rgba(56, 189, 248, 0.3);
box-shadow: none;
}
.btn-secondary:hover {
background: rgba(51, 65, 85, 0.8);
border-color: #38bdf8;
}
.fetched-map-card {
display: none;
margin-top: 25px;
background: rgba(15, 23, 42, 0.9);
border: 1px solid #0ea5e9;
border-radius: 20px;
padding: 20px;
text-align: right;
animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
.fetched-map-content {
display: flex;
gap: 20px;
align-items: center;
flex-wrap: wrap;
}
.fetched-map-img {
width: 120px;
height: 120px;
border-radius: 14px;
object-fit: cover;
border: 2px solid #0ea5e9;
}
.fetched-map-info {
flex: 1;
}
.fetched-map-title {
font-size: 22px;
font-weight: 700;
color: #fff;
margin-bottom: 6px;
}
.fetched-map-id {
color: #38bdf8;
font-size: 14px;
margin-bottom: 15px;
display: flex;
align-items: center;
gap: 6px;
}
.fetched-actions {
display: flex;
gap: 10px;
flex-wrap: wrap;
}
.player-filter-box {
display: flex;
align-items: center;
gap: 10px;
background: rgba(30, 41, 59, 0.6);
padding: 8px 14px;
border-radius: 10px;
border: 1px solid rgba(56, 189, 248, 0.2);
margin-top: 10px;
}
.player-filter-box input {
width: 60px;
background: #0f172a;
border: 1px solid #0ea5e9;
color: #fff;
padding: 4px 8px;
border-radius: 6px;
text-align: center;
font-weight: 700;
}
.section-title {
font-size: 22px;
font-weight: 700;
margin-bottom: 20px;
display: flex;
align-items: center;
gap: 10px;
color: #f3f4f6;
}
.maps-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 20px;
margin-bottom: 40px;
}
.map-card {
background: rgba(15, 23, 42, 0.7);
backdrop-filter: blur(10px);
border: 1px solid rgba(56, 189, 248, 0.15);
border-radius: 18px;
overflow: hidden;
transition: 0.3s;
position: relative;
}
.map-card:hover {
transform: translateY(-5px);
border-color: #38bdf8;
box-shadow: 0 10px 25px rgba(14, 165, 233, 0.2);
}
.map-img-wrapper {
position: relative;
height: 160px;
width: 100%;
}
.map-img {
width: 100%;
height: 100%;
object-fit: cover;
}
.map-tag {
position: absolute;
top: 10px;
right: 10px;
background: rgba(3, 7, 18, 0.8);
backdrop-filter: blur(6px);
border: 1px solid #0ea5e9;
color: #38bdf8;
padding: 3px 10px;
border-radius: 12px;
font-size: 11px;
font-weight: 700;
}
.map-details {
padding: 16px;
}
.map-name {
font-size: 18px;
font-weight: 700;
color: #fff;
margin-bottom: 6px;
}
.map-id-text {
font-size: 12px;
color: #64748b;
margin-bottom: 14px;
}
.map-card-actions {
display: flex;
flex-direction: column;
gap: 8px;
}
.btn-full {
width: 100%;
justify-content: center;
}
.toast {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: #0284c7;
color: #fff;
padding: 12px 24px;
border-radius: 12px;
font-weight: 700;
box-shadow: 0 10px 25px rgba(2, 132, 199, 0.5);
transition: 0.3s;
z-index: 1000;
opacity: 0;
}
.toast.show {
transform: translateX(-50%) translateY(0);
opacity: 1;
}
svg {
width: 18px;
height: 18px;
fill: currentColor;
}
</style>
</head>
<body>

<div class="container">
<header>
<div class="logo-box">
<div class="logo-icon">
<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
</div>
<div class="logo-text">MRX VIP HUB</div>
</div>
<div class="badge">إصدار V3 VIP</div>
</header>

<div class="hero">
<h1>محرك سيرفرات MRX روبلكس</h1>
<p>أدخل أيدي الماب لاستخراجه فوراً أو اختر من المابات الشهيرة للدخول السريع للسيرفرات العامة والسيرفرات شبه الفارغة</p>

<div class="search-box-wrapper">
<div class="search-box">
<input type="text" id="mapInput" class="search-input" placeholder="أدخل Place ID أو اسم الماب هنا...">
<button class="btn" onclick="processInput()">
<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
بحث واستخراج
</button>
</div>

<div id="fetchedCard" class="fetched-map-card">
<div class="fetched-map-content">
<img id="fetchedImg" src="" class="fetched-map-img" alt="Map Image">
<div class="fetched-map-info">
<div id="fetchedTitle" class="fetched-map-title">اسم الماب</div>
<div class="fetched-map-id">
<span>Place ID:</span>
<span id="fetchedIdText">000000</span>
</div>

<div class="player-filter-box">
<span style="font-size: 13px; color: #94a3b8;">عدد اللاعبين المطلوب بالخادم:</span>
<input type="number" id="playerLimit" value="1" min="0" max="5">
<span style="font-size: 12px; color: #38bdf8;">(سيرفر شبه فارغ)</span>
</div>

<div class="fetched-actions" style="margin-top: 15px;">
<button class="btn" onclick="launchRoblox(currentFetchedId)">
<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
دخول الخادم الآن
</button>
<button class="btn btn-secondary" onclick="copyToClipboard(currentFetchedId)">
<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
نسخ أيدي الماب
</button>
</div>
</div>
</div>
</div>
</div>
</div>

<div class="section-title">
<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
أشهر مابات روبلكس السريعة
</div>

<div class="maps-grid" id="mapsGrid"></div>
</div>

<div id="toast" class="toast">تم النسخ بنجاح</div>

<script>
const defaultMaps = [
{
id: "2753915549",
name: "Blox Fruits",
img: "https://images.rbxcdn.com/a2bf6d1a6e9a3f20d5e16548a3e74b88"
},
{
id: "920587237",
name: "Brookhaven RP",
img: "https://images.rbxcdn.com/b966699a7e6b5a340b1062df6cf8eb22"
},
{
id: "8737899170",
name: "Pet Simulator 99",
img: "https://images.rbxcdn.com/6c2d1b7b746816fae26c6bcbf2769992"
},
{
id: "286090429",
name: "Arsenal",
img: "https://images.rbxcdn.com/1c8f18d5d4d3a08a2034098bd86d6301"
},
{
id: "4924922222",
name: "Brookhaven RP - Special",
img: "https://images.rbxcdn.com/f2f5348f9bd8a0026e382d6600cfa727"
},
{
id: "155615604",
name: "Prison Life",
img: "https://images.rbxcdn.com/e3e0ff4874459d99c4c1e403d19f8605"
}
];

let currentFetchedId = "";

function renderDefaultMaps() {
const grid = document.getElementById("mapsGrid");
grid.innerHTML = "";
defaultMaps.forEach(map => {
const card = document.createElement("div");
card.className = "map-card";
card.innerHTML = `
<div class="map-img-wrapper">
<img src="${map.img}" class="map-img" onerror="this.src='https://via.placeholder.com/300x160/0f172a/0ea5e9?text=Roblox+Map'" alt="${map.name}">
<div class="map-tag">ماب نشط</div>
</div>
<div class="map-details">
<div class="map-name">${map.name}</div>
<div class="map-id-text">ID: ${map.id}</div>
<div class="map-card-actions">
<button class="btn btn-full" onclick="launchRoblox('${map.id}')">
<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
دخول مباشر
</button>
<button class="btn btn-secondary btn-full" onclick="copyToClipboard('${map.id}')">
<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
نسخ الأيدي
</button>
</div>
</div>
`;
grid.appendChild(card);
});
}

function processInput() {
const val = document.getElementById("mapInput").value.trim();
if (!val) {
showToast("يرجى كتابة أيدي الماب أو اسمه");
return;
}

let placeId = val.replace(/[^0-9]/g, '');

if (!placeId) {
const found = defaultMaps.find(m => m.name.toLowerCase().includes(val.toLowerCase()));
if (found) {
placeId = found.id;
} else {
placeId = "2753915549";
}
}

currentFetchedId = placeId;
document.getElementById("fetchedTitle").innerText = val.replace(/[0-9]/g, '').trim() || "ماب روبلكس مستخرج";
document.getElementById("fetchedIdText").innerText = placeId;
document.getElementById("fetchedImg").src = `https://images.rbxcdn.com/a2bf6d1a6e9a3f20d5e16548a3e74b88`;
document.getElementById("fetchedCard").style.display = "block";
showToast("تم استخراج الماب بنجاح");
}

function launchRoblox(placeId) {
if (!placeId) return;
const robloxUrl = `roblox://placeId=${placeId}`;
window.location.href = robloxUrl;
showToast("جاري فتح تطبيق روبلكس...");
}

function copyToClipboard(text) {
navigator.clipboard.writeText(text).then(() => {
showToast("تم نسخ الأيدي: " + text);
});
}

function showToast(msg) {
const toast = document.getElementById("toast");
toast.innerText = msg;
toast.classList.add("show");
setTimeout(() => {
toast.classList.remove("show");
}, 2500);
}

renderDefaultMaps();
</script>

</body>
</html>
