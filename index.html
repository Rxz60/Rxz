<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRX Security Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@400;500;600&display=swap');

  :root {
    --bg-dark: #0a0e1a;
    --bg-card: #111827;
    --bg-input: #0d1322;
    --border: #1e3a5f;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-glow: rgba(59, 130, 246, 0.3);
    --text-main: #e2e8f0;
    --text-dim: #94a3b8;
    --text-bright: #ffffff;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --raw-bg: #0d1117;
    --raw-border: #30363d;
    --raw-header: #161b22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === ANIMATED BACKGROUND === */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(37,99,235,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(96,165,250,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(59,130,246,0.5);
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* === LOGIN SCREEN === */
  #loginScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    background: var(--bg-dark);
  }

  #loginScreen.hidden { display: none; }

  .login-container {
    width: min(420px, 90vw);
    padding: 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(59,130,246,0.15), 0 0 120px rgba(59,130,246,0.05);
  }

  .login-container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #60a5fa, var(--accent));
  }

  .login-logo {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: grid;
    place-items: center;
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    background: rgba(59,130,246,0.1);
    font-family: 'Fira Code', monospace;
  }

  .login-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--text-bright);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .login-sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .login-field {
    text-align: right;
    margin-bottom: 18px;
  }

  .login-field label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .login-field input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-bright);
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
  }

  .login-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59,130,246,0.4);
  }

  .login-btn:active { transform: translateY(0); }

  .login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 20px;
  }

  /* === MAIN APP === */
  #mainApp {
    display: none;
    position: relative;
    z-index: 1;
  }

  #mainApp.active { display: block; }

  /* Header */
  .app-header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 900;
    color: var(--accent);
    background: rgba(59,130,246,0.1);
    font-family: 'Fira Code', monospace;
  }

  .header-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--text-bright);
  }

  .header-title span {
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    gap: 10px;
  }

  .btn-header {
    padding: 8px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-header:hover {
    border-color: var(--accent);
    color: var(--text-main);
  }

  /* Content Area */
  .content {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  /* Upload Section */
  .upload-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  .upload-section::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .section-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::before {
    content: "◆";
    font-size: 10px;
  }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--bg-input);
    position: relative;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(59,130,246,0.05);
    box-shadow: 0 0 30px rgba(59,130,246,0.1);
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .upload-text {
    font-size: 15px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .upload-hint {
    font-size: 12px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  #fileInput { display: none; }

  .file-info {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 8px;
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    color: var(--text-main);
    word-break: break-all;
  }

  .file-info.show { display: block; }

  .encode-area {
    margin-top: 20px;
  }

  .textarea-wrapper {
    position: relative;
  }

  #scriptOutput {
    width: 100%;
    min-height: 180px;
    padding: 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--success);
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    resize: vertical;
    outline: none;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
  }

  #scriptOutput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: white;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59,130,246,0.4);
  }

  .btn-secondary {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--text-main);
  }

  .btn-danger {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--danger);
  }

  .btn-danger:hover {
    background: rgba(239,68,68,0.2);
  }

  .btn-success {
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3);
    color: var(--success);
  }

  .btn-success:hover {
    background: rgba(34,197,94,0.2);
  }

  .btn-sm {
    padding: 6px 14px;
    font-size: 12px;
  }

  /* Raw Display - GitHub Style */
  .raw-display {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 30px;
  }

  .raw-header {
    background: var(--raw-header);
    border-bottom: 1px solid var(--raw-border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .raw-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .raw-icon {
    color: var(--text-dim);
    font-size: 18px;
  }

  .raw-filename {
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    color: var(--text-bright);
  }

  .raw-badge {
    padding: 2px 8px;
    background: rgba(34,197,94,0.15);
    color: var(--success);
    border-radius: 12px;
    font-size: 11px;
    font-family: 'Fira Code', monospace;
  }

  .raw-body {
    background: var(--raw-bg);
    padding: 20px;
    overflow-x: auto;
  }

  .raw-code {
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    color: #c9d1d9;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.7;
    direction: ltr;
    text-align: left;
  }

  .raw-footer {
    background: var(--raw-header);
    border-top: 1px solid var(--raw-border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .raw-url {
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    color: var(--text-dim);
    direction: ltr;
    text-align: left;
    word-break: break-all;
  }

  .raw-actions {
    display: flex;
    gap: 8px;
  }

  /* Scripts List */
  .scripts-section {
    margin-top: 10px;
  }

  .scripts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .script-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .script-card:hover {
    border-color: rgba(59,130,246,0.3);
    box-shadow: 0 4px 20px rgba(59,130,246,0.1);
  }

  .script-card-header {
    background: var(--raw-header);
    border-bottom: 1px solid var(--raw-border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .script-card-title {
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    color: var(--text-bright);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .script-card-time {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Fira Code', monospace;
  }

  .script-card-body {
    background: var(--raw-bg);
    padding: 16px 20px;
  }

  .script-preview {
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: ltr;
    text-align: left;
    margin-bottom: 12px;
  }

  .script-card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  /* Toast */
  .toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    padding: 12px 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-main);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.info { border-color: var(--accent); color: var(--accent); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; }
    to { opacity: 0; transform: translateY(-20px); }
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(600px, 90vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-bright);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .modal-close:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  .modal-body {
    padding: 20px;
    overflow-y: auto;
  }

  .modal-body textarea {
    width: 100%;
    min-height: 200px;
    padding: 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--success);
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    resize: vertical;
    outline: none;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
  }

  .modal-body textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* Loading */
  .loading-spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 600px) {
    .content { padding: 20px 12px; }
    .upload-section, .raw-display { padding: 16px; }
    .btn { padding: 10px 16px; font-size: 13px; }
    .app-header { padding: 12px 16px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

<!-- Stars Background -->
<div class="stars" id="stars"></div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-container">
    <div class="login-logo">TRX</div>
    <h1 class="login-title">TRX Security Hub</h1>
    <p class="login-sub">أدخل بياناتك للوصول إلى لوحة التحكم</p>
    
    <div class="login-field">
      <label for="loginUser">اسم المستخدم</label>
      <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم..." autocomplete="off">
    </div>
    
    <div class="login-field">
      <label for="loginPass">كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    
    <button class="login-btn" onclick="tryLogin()">تسجيل الدخول</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp">
  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo">TRX</div>
      <div class="header-title">TRX <span>Security Hub</span></div>
    </div>
    <div class="header-actions">
      <button class="btn-header" onclick="showStats()">📊 الإحصائيات</button>
      <button class="btn-header" onclick="logout()">🚪 خروج</button>
    </div>
  </header>

  <!-- Content -->
  <div class="content">
    <!-- Upload Section -->
    <div class="upload-section">
      <div class="section-label">رفع وتشغيل السكربت</div>
      
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📁</div>
        <div class="upload-text">اضغط أو اسحب الملف هنا</div>
        <div class="upload-hint">يتم دعم ملفات .lua, .js, .txt</div>
        <input type="file" id="fileInput" accept=".lua,.js,.txt,.json,.xml">
      </div>
      
      <div class="file-info" id="fileInfo"></div>
      
      <div class="encode-area">
        <div class="section-label" style="margin-top:16px">النتيجة المشفرة</div>
        <div class="textarea-wrapper">
          <textarea id="scriptOutput" placeholder="ستظهر النتيجة هنا..."></textarea>
        </div>
        
        <div class="btn-row">
          <button class="btn btn-primary" onclick="createRaw()">🔒 إنشاء RAW محمي</button>
          <button class="btn btn-secondary" onclick="copyResult()">📋 نسخ</button>
          <button class="btn btn-secondary" onclick="clearAll()">🗑️ مسح</button>
        </div>
      </div>
    </div>

    <!-- Scripts List -->
    <div class="scripts-section">
      <div class="section-label">السكربتات المنشأة</div>
      <div class="scripts-list" id="scriptsList">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">📦</div>
          <p>لا توجد سكربتات بعد</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">✏️ تعديل السكربت</div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="editTextarea"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveEdit()">💾 حفظ</button>
    </div>
  </div>
</div>

<script>
// ===== CONFIG =====
const ADMIN_USER = "TRX_77";
const ADMIN_PASS = "admin"; // يمكنك تغييرها

// ===== STARS BACKGROUND =====
(function createStars() {
  const container = document.getElementById('stars');

// ===== TOAST SYSTEM =====
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `${icons[type] || ''} ${msg}`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== LOGIN SYSTEM =====
function tryLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  
  if (user === ADMIN_USER && pass === ADMIN_PASS) {
    localStorage.setItem('trx_auth', 'true');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.add('active');
    showToast('تم تسجيل الدخول بنجاح', 'success');
    loadScripts();
  } else {
    errEl.textContent = '❌ بيانات خاطئة! جرّب مرة أخرى.';
    showToast('بيانات الدخول غير صحيحة', 'error');
  }
}

// Check saved auth
if (localStorage.getItem('trx_auth') === 'true') {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.add('active');
  loadScripts();
}

// Enter key login
document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

function logout() {
  localStorage.removeItem('trx_auth');
  location.reload();
}

// ===== FILE UPLOAD =====
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
let currentFile = null;

uploadZone.addEventListener('dragover', e => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});

uploadZone.addEventListener('dragleave', () => {
  uploadZone.classList.remove('dragover');
});

uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  currentFile = file;
  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    document.getElementById('fileInfo').innerHTML = 
      `📄 <strong>${file.name}</strong> (${formatSize(file.size)})<br><small style="color:#94a3b8">${content.substring(0, 200)}${content.length > 200 ? '...' : ''}</small>`;
    document.getElementById('fileInfo').classList.add('show');
    document.getElementById('scriptOutput').value = content;
    showToast(`تم تحميل "${file.name}"`, 'success');
  };
  reader.readAsText(file);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// ===== ENCRYPTION (Simple XOR + Base64 with protection wrapper) =====
function encryptScript(script) {
  const key = 'TRX_SECURITY_V3';
  let encrypted = '';
  for (let i = 0; i < script.length; i++) {
    encrypted += String.fromCharCode(script.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return btoa(encrypted);
}

function decryptScript(encoded) {
  try {
    const decrypted = atob(encoded);
    let result = '';
    const key = 'TRX_SECURITY_V3';
    for (let i = 0; i < decrypted.length; i++) {
      result += String.fromCharCode(decrypted.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return result;
  } catch(e) {
    return null;
  }
}

// ===== CREATE RAW =====
function createRaw() {
  const script = document.getElementById('scriptOutput').value.trim();
  if (!script) {
    showToast('اكتب أو ارفع سكربت أولاً!', 'error');
    return;
  }
  
  const encrypted = encryptScript(script);
  const rawId = generateId();
  const timestamp = Date.now();
  
  const rawData = {
    id: rawId,
    name: currentFile ? currentFile.name : `script_${rawId}.lua`,
    encrypted: encrypted,
    created: timestamp,
    originalContent: script
  };
  
  // Save to localStorage
  let scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  scripts.unshift(rawData);
  localStorage.setItem('trx_scripts', JSON.stringify(scripts));
  
  // Show in list
  renderScriptCard(rawData);
  
  // Generate raw URL (simulated)
  const rawUrl = `${window.location.origin}/raw/${rawId}`;
  
  showToast('تم إنشاء RAW بنجاح 🔒', 'success');
  
  // Auto copy link
  navigator.clipboard?.writeText(rawUrl).then(() => {
    showToast('تم نسخ الرابط!', 'success');
  });
}

function generateId() {
  return Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
}

// ===== RENDER SCRIPT CARDS =====
function renderScriptCard(data) {
  const list = document.getElementById('scriptsList');
  const empty = document.getElementById('emptyState');
  if (empty) empty.style.display = 'none';
  
  const card = document.createElement('div');
  card.className = 'script-card';
  card.id = `script-${data.id}`;
  
  const date = new Date(data.created).toLocaleString('ar-SA');
  const preview = data.encrypted.substring(0, 80) + '...';
  
  card.innerHTML = `
    <div class="script-card-header">
      <div class="script-card-title">
        📜 ${escapeHtml(data.name)}
        <span class="raw-badge">PROTECTED</span>
      </div>
      <div class="script-card-time">${date}</div>
    </div>
    <div class="script-card-body">
      <div class="script-preview">${escapeHtml(preview)}</div>
      <div class="script-card-actions">
        <button class="btn btn-sm btn-primary" onclick="viewRaw('${data.id}')">👁️ عرض RAW</button>
        <button class="btn btn-sm btn-secondary" onclick="editScript('${data.id}')">✏️ تعديل</button>
        <button class="btn btn-sm btn-success" onclick="copyRawLink('${data.id}')">🔗 رابط RAW</button>
        <button class="btn btn-sm btn-danger" onclick="deleteScript('${data.id}')">🗑️ حذف</button>
      </div>
    </div>
  `;
  
  list.insertBefore(card, list.firstChild);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== VIEW RAW (GitHub Style) =====
function viewRaw(id) {
  const scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  const script = scripts.find(s => s.id === id);
  if (!script) return;
  
  const modal = document.getElementById('editModal');
  const textarea = document.getElementById('editTextarea');
  const title = modal.querySelector('.modal-title');
  
  title.textContent = `🔒 RAW: ${script.name}`;
  textarea.value = script.encrypted;
  textarea.readOnly = true;
  
  modal.classList.add('active');
  
  // Also show a simulated raw page
  showToast('تم فتح العرض الخام', 'info');
}

// ===== EDIT SCRIPT =====
function editScript(id) {
  const scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  const script = scripts.find(s => s.id === id);
  if (!script) return;
  
  const modal = document.getElementById('editModal');
  const textarea = document.getElementById('editTextarea');
  const title = modal.querySelector('.modal-title');
  
  // Decrypt for editing
  const decrypted = decryptScript(script.encrypted);
  
  title.textContent = `✏️ تعديل: ${script.name}`;
  textarea.value = decrypted || script.encrypted;
  textarea.readOnly = false;
  
  modal.dataset.editId = id;
  modal.classList.add('active');
}

function saveEdit() {
  const id = document.getElementById('editModal').dataset.editId;
  const newText = document.getElementById('editTextarea').value;
  
  let scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  const idx = scripts.findIndex(s => s.id === id);
  if (idx === -1) return;
  
  scripts[idx].encrypted = encryptScript(newText);
  scripts[idx].originalContent = newText;
  scripts[idx].edited = Date.now();
  
  localStorage.setItem('trx_scripts', JSON.stringify(scripts));
  closeEditModal();
  loadScripts();
  showToast('تم الحفظ بنجاح', 'success');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('active');
}

// ===== COPY RAW LINK =====
function copyRawLink(id) {
  const url = `${window.location.origin}/raw/${id}`;
  navigator.clipboard?.writeText(url).then(() => {
    showToast('تم نسخ رابط RAW!', 'success');
  }).catch(() => {
    prompt('انسخ الرابط:', url);
  });
}

// ===== DELETE SCRIPT =====
function deleteScript(id) {
  if (!confirm('هل أنت متأكد من الحذف؟')) return;
  
  let scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  scripts = scripts.filter(s => s.id !== id);
  localStorage.setItem('trx_scripts', JSON.stringify(scripts));
  
  const el = document.getElementById(`script-${id}`);
  if (el) el.remove();
  
  showToast('تم الحذف', 'error');
}

// ===== LOAD ALL SCRIPTS =====
function loadScripts() {
  const scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  const list = document.getElementById('scriptsList');
  list.innerHTML = '';
  
  if (scripts.length === 0) {
    list.innerHTML = '<div class="empty-state" id="emptyState"><div class="empty-icon">📦</div><p>لا توجد سكربتات بعد</p></div>';
    return;
  }
  
  scripts.forEach(s => renderScriptCard(s));
}

// ===== UTILITY FUNCTIONS =====
function copyResult() {
  const text = document.getElementById('scriptOutput').value;
  if (!text) { showToast('لا شيء للنسخ!', 'error'); return; }
  navigator.clipboard?.writeText(text).then(() => {
    showToast('تم النسخ!', 'success');
  });
}

function clearAll() {
  document.getElementById('scriptOutput').value = '';
  document.getElementById('fileInfo').classList.remove('show');
  document.getElementById('fileInfo').innerHTML = '';
  document.getElementById('fileInput').value = '';
  currentFile = null;
  showToast('تم المسح', 'info');
}

function showStats() {
  const scripts = JSON.parse(localStorage.getItem('trx_scripts') || '[]');
  showToast(`📊 لديك ${scripts.length} سكربت محفوظ`, 'info');
}

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});
</script>
