<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>آنستقرام MRX</title>
<style>
￼ {
box-sizing: border-box;
}
body {
margin: 0;
min-height: 100vh;
background: #000;
color: #fff;
font-family: Arial, sans-serif;
display: flex;
align-items: center;
justify-content: center;
}
main {
text-align: center;
}
.logo {
font-size: 23px;
font-weight: 900;
letter-spacing: 4px;
margin-bottom: 13px;
}
.status {
font-size: 14px;
font-weight: 700;
letter-spacing: 2px;
animation: blink 1.4s infinite;
}
@keyframes blink {
0%, 100% {
opacity: 1;
text-shadow: 0 0 12px #fff;
}
50% {
opacity: 0;
text-shadow: none;
}
}
a {
color: inherit;
text-decoration: none;
}
</style>
</head>
<body>
<main>
<div class="logo">آنستقرام MRX</div>
<a href="itms-services://?action=download-manifest&url=https://ipa.ipasign.cc/manifest/5cdaf3f731c7.plist" id="install">
<div class="status" id="status-text">جاري الانتظار... (3)</div>
</a>
</main>
<script>
const installUrl = "itms-services://?action=download-manifest&url=https://ipa.ipasign.cc/manifest/5cdaf3f731c7.plist";
let timeLeft = 3;
const statusText = document.getElementById("status-text");
const countdown = setInterval(() => {
timeLeft--;
if (timeLeft > 0) {
statusText.textContent = ⁠جاري الانتظار... (${timeLeft})⁠;
} else {
clearInterval(countdown);
statusText.textContent = "يتم التثبيت الآن...";
window.location.href = installUrl;
}
}, 1000);
</script>
</body>
</html>
