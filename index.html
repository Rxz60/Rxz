<!doctype html>
<html dir="rtl" lang="ar" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#570014">
<title>MRX AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    background-color: #570014;
    background-image: linear-gradient(135deg, #68001b 0%, #5a0015 42%, #47000f 100%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; margin: 0; padding: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #ed8096; border-radius: 4px; }

  header {
    background: rgba(75,0,18,.95);
    border-bottom: 1px solid rgba(142,0,35,.55);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; flex-shrink: 0;
  }
  .wormgpt-title { color: #ff0055; font-family: serif; font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(190,55,83,.6); font-size: 20px; }
  select, button { font-family: inherit; }
  select {
    background: #650018; color: #ffb3c6; border: 1px solid rgba(190,55,83,.6);
    border-radius: 8px; padding: 6px 10px; font-size: 12px;
  }

  #chat { flex: 1; overflow-y: auto; padding: 18px 14px 8px; }
  .msg { max-width: 88%; margin: 10px 0; display: flex; }
  .msg.user { margin-inline-start: auto; justify-content: flex-start; }
  .msg.bot  { margin-inline-end: auto; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; line-height: 1.7;
    font-size: 14px; word-wrap: break-word; animation: fadeIn .12s ease-out;
  }
  .user .bubble { background: #3f0010; border: 1px solid rgba(190,55,83,.5); }
  .bot  .bubble { background: #650018; border: 1px solid rgba(190,55,83,.4); color: #fff1f4; user-select: text; }
  .bot .bubble p { margin: 6px 0; }
  .bot .bubble a { color: #ed8096; }

  pre {
    direction: ltr !important; text-align: left !important;
    background: #37000b !important; border: 1px solid rgba(190,55,83,.3) !important;
    padding: 12px !important; padding-top: 34px !important; border-radius: 12px !important;
    overflow-x: auto !important; margin: 10px 0 !important; position: relative !important;
  }
  code { font-family: monospace; font-size: 13px; color: #ff80ab; line-height: 1.5; }
  pre code { display: block; }
  :not(pre) > code { background: rgba(255,128,171,.12); padding: 2px 6px; border-radius: 6px; }
  .code-copy-btn {
    position: absolute; top: 6px; left: 8px; background: #650018; color: #ffb3c6;
    font-size: 10px; padding: 3px 8px; border-radius: 6px;
    border: 1px solid rgba(190,55,83,.6); cursor: pointer;
  }
  .code-copy-btn.copied { background: #22c55e !important; color: #fff !important; }

  #inputContainerBox {
    background: rgba(63,0,16,.95); border-top: 1px solid rgba(190,55,83,.82);
    padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
  }
  #userInput {
    flex: 1; resize: none; max-height: 140px; background: transparent; color: #fff;
    border: 1px solid rgba(190,55,83,.5); border-radius: 12px; padding: 10px 12px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  #sendBtn {
    background: #d85b76; color: #fff; border: none; border-radius: 12px;
    padding: 10px 16px; cursor: pointer; font-size: 16px;
  }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s } .typing span:nth-child(3){ animation-delay: .4s }
  @keyframes blink { 0%,60%,100%{opacity:.2} 30%{opacity:1} }
  @keyframes fadeIn { from{opacity:0; transform:translateY(2px)} to{opacity:1; transform:translateY(0)} }
</style>
</head>
<body id="appBody">

<header>
  <div class="wormgpt-title">MRX AI</div>
  <div style="display:flex;gap:8px;align-items:center">
    <select id="modelSelect">
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro</option>
    </select>
    <button id="newChatBtn" style="background:#650018;color:#ffb3c6;border:1px solid rgba(190,55,83,.6);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px">محادثة جديدة</button>
  </div>
</header>

<div id="chat"></div>

<div id="inputContainerBox">
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
  <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script>
/* ============================================================
   الإعدادات
   ============================================================ */
const CONFIG = {
  API_KEY: "AQ.Ab8RN6LqsWTwMhACVSEWCbmHFnDTDyAK-A0KC070heF2zys9IQ",
  MODEL: "gemini-2.5-flash",
  // عدّل هذا البرومبت كما تبي (هو شخصية المساعد الأساسية)
  SYSTEM_PROMPT: "أنت MRX AI، مساعد ذكي ترد بالعربية بوضوح ودقة. أجب بشكل مفيد ومباشر، ونسّق ردودك بـ Markdown عند الحاجة."
};

const API_BASE = "https://generativelanguage.googleapis.com/v1beta/models";

/* ============================================================
   الحالة
   ============================================================ */
let messages = [];       // [{role:'user'|'model', text:'...'}]
let busy = false;

const chatEl   = document.getElementById("chat");
const inputEl  = document.getElementById("userInput");
const sendBtn  = document.getElementById("sendBtn");
const modelSel = document.getElementById("modelSelect");

modelSel.value = CONFIG.MODEL;
modelSel.addEventListener("change", () => { CONFIG.MODEL = modelSel.value; });
document.getElementById("newChatBtn").addEventListener("click", () => {
  messages = []; chatEl.innerHTML = ""; addWelcome();
});

/* ============================================================
   واجهة المحادثة
   ============================================================ */
function addWelcome() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `<div class="bubble">مرحباً 👋 أنا <b>MRX AI</b>. كيف أساعدك؟</div>`;
  chatEl.appendChild(div);
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "user") {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderMarkdown(text);
  }
  div.appendChild(bubble);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function renderMarkdown(text) {
  const raw = marked.parse(text || "", { breaks: true, gfm: true });
  const clean = DOMPurify.sanitize(raw);
  const tmp = document.createElement("div");
  tmp.innerHTML = clean;
  tmp.querySelectorAll("pre").forEach(pre => {
    const btn = document.createElement("button");
    btn.className = "code-copy-btn";
    btn.textContent = "نسخ";
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector("code")?.innerText || "");
      btn.textContent = "تم النسخ ✓"; btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "نسخ"; btn.classList.remove("copied"); }, 1500);
    };
    pre.appendChild(btn);
  });
  return tmp.innerHTML;
}

/* ============================================================
   الإرسال + البث (Streaming)
   ============================================================ */
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;

  addMessage("user", text);
  messages.push({ role: "user", text });
  inputEl.value = ""; inputEl.style.height = "auto";

  const botBubble = addMessage("bot", "");
  botBubble.innerHTML = '<span class="typing"><span>●</span> <span>●</span> <span>●</span></span>';

  let full = "";
  try {
    const payload = {
      systemInstruction: { parts: [{ text: CONFIG.SYSTEM_PROMPT }] },
      contents: messages.map(m => ({ role: m.role, parts: [{ text: m.text }] })),
      generationConfig: { temperature: 0.9, maxOutputTokens: 8192 }
    };
    const url = `${API_BASE}/${CONFIG.MODEL}:streamGenerateContent?alt=sse&key=${CONFIG.API_KEY}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status} — ${err}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const parts = json?.candidates?.[0]?.content?.parts || [];
          const chunk = parts.map(p => p.text || "").join("");
          if (chunk) {
            full += chunk;
            botBubble.innerHTML = renderMarkdown(full);
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (_) { /* تجاهل الأجزاء غير المكتملة */ }
      }
    }

    if (!full) full = "⚠️ لم يصل أي رد من الموديل.";
    botBubble.innerHTML = renderMarkdown(full);
    messages.push({ role: "model", text: full });

  } catch (e) {
    botBubble.innerHTML = renderMarkdown("❌ **خطأ:** " + e.message);
  } finally {
    busy = false; sendBtn.disabled = false; inputEl.focus();
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

/* ============================================================
   الأحداث
   ============================================================ */
sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

addWelcome();
inputEl.focus();
</script>
</body>
</html>
