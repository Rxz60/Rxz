<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيد تيك توك</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f0f0f;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;direction:rtl;padding:20px}
        .container{background:#1e1e1e;border-radius:30px;padding:40px;max-width:700px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.8);border:1px solid #333}
        h1{color:#fff;text-align:center;font-size:28px;margin-bottom:10px}
        .sub{color:#aaa;text-align:center;font-size:15px;margin-bottom:30px;border-bottom:1px solid #2a2a2a;padding-bottom:15px}
        .group{display:flex;flex-direction:column;gap:12px;margin-bottom:25px}
        .group label{color:#ccc;font-size:16px}
        .group input{padding:14px 18px;border-radius:16px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:16px;outline:none;transition:0.3s}
        .group input:focus{border-color:#00d4ff;box-shadow:0 0 15px rgba(0,212,255,0.2)}
        .btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:20px;font-weight:700;background:linear-gradient(135deg,#00d4ff,#0088cc);color:#fff;cursor:pointer;transition:0.3s;box-shadow:0 4px 20px rgba(0,212,255,0.3);margin-top:10px}
        .btn:hover{transform:scale(1.02)}
        .btn:active{transform:scale(0.97)}
        .btn:disabled{opacity:0.6;cursor:not-allowed}
        .result{display:none;margin-top:30px;background:#1a1a1a;border-radius:16px;padding:20px;border:1px solid #2a2a2a}
        .result.show{display:block}
        .profile{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
        .profile img{width:80px;height:80px;border-radius:50%;border:3px solid #00d4ff;object-fit:cover;background:#222}
        .profile .info{flex:1}
        .profile .info h2{color:#fff;font-size:22px}
        .profile .info .un{color:#888;font-size:16px;direction:ltr;text-align:left}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:15px;margin:20px 0}
        .stat-card{background:#252525;padding:15px 10px;border-radius:14px;text-align:center;border:1px solid #333}
        .stat-card .num{color:#00d4ff;font-size:22px;font-weight:700;display:block}
        .stat-card .lab{color:#aaa;font-size:13px;margin-top:5px}
        .extra{color:#ccc;font-size:14px;line-height:1.8;margin-top:15px;padding-top:15px;border-top:1px solid #2a2a2a}
        .extra span{color:#fff;font-weight:500}
        .status{color:#ffa500;text-align:center;margin-top:15px;font-size:14px;min-height:24px}
        .webhook-status{color:#aaa;font-size:14px;text-align:center;margin-top:8px}
        .footer{margin-top:25px;text-align:center;color:#555;font-size:13px;border-top:1px solid #222;padding-top:18px}
        @media(max-width:500px){.container{padding:25px 20px}.profile{flex-direction:column;align-items:center;text-align:center}.profile .info .un{text-align:center}.stats{grid-template-columns:1fr 1fr}}
    </style>
</head>
<body>
<div class="container">
    <h1>🎣 صيد تيك توك</h1>
    <div class="sub">أدخل اسم المستخدم واضغط «تفعيل»</div>
    <div class="group">
        <label>👤 اسم المستخدم</label>
        <input type="text" id="username" placeholder="@example" value="@mrbeast">
    </div>
    <div class="group">
        <label>🔗 رابط Webhook</label>
        <input type="url" id="webhook" placeholder="https://discord.com/api/webhooks/...">
        <div id="webhookStatus" class="webhook-status"></div>
    </div>
    <button class="btn" id="fetchBtn">🚀 تفعيل</button>
    <div id="statusMsg" class="status"></div>
    <div class="result" id="resultBox">
        <div class="profile">
            <img id="avatar" src="">
            <div class="info">
                <h2 id="displayName">—</h2>
                <div class="un" id="uniqueId">—</div>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card"><span class="num" id="following">0</span><span class="lab">متابَع</span></div>
            <div class="stat-card"><span class="num" id="fans">0</span><span class="lab">متابِع</span></div>
            <div class="stat-card"><span class="num" id="likes">0</span><span class="lab">إعجابات</span></div>
            <div class="stat-card"><span class="num" id="videos">0</span><span class="lab">فيديوهات</span></div>
        </div>
        <div class="extra" id="extraInfo">
            <div><span>🆔 المعرف الفريد:</span> <span id="userId">—</span></div>
            <div><span>📝 البايو:</span> <span id="bio">—</span></div>
            <div><span>🔗 الرابط:</span> <span id="link">—</span></div>
            <div><span>🌐 المنطقة:</span> <span id="region">—</span></div>
            <div><span>📅 تاريخ الانضمام:</span> <span id="joinDate">—</span></div>
            <div><span>📺 البثوث المباشرة:</span> <span id="liveCount">—</span></div>
            <div><span>✅ موثّق:</span> <span id="verified">—</span></div>
            <div><span>👤 خاص:</span> <span id="private">—</span></div>
        </div>
    </div>
    <div class="footer">© 2026 - صيد-معلومات-يوزر-تيك</div>
</div>
<script>
    (() => {
        const usernameInput = document.getElementById('username');
        const webhookInput = document.getElementById('webhook');
        const fetchBtn = document.getElementById('fetchBtn');
        const statusMsg = document.getElementById('statusMsg');
        const resultBox = document.getElementById('resultBox');
        const webhookStatus = document.getElementById('webhookStatus');
        const avatar = document.getElementById('avatar');
        const displayName = document.getElementById('displayName');
        const uniqueId = document.getElementById('uniqueId');
        const following = document.getElementById('following');
        const fans = document.getElementById('fans');
        const likes = document.getElementById('likes');
        const videos = document.getElementById('videos');
        const userId = document.getElementById('userId');
        const bio = document.getElementById('bio');
        const link = document.getElementById('link');
        const region = document.getElementById('region');
        const joinDate = document.getElementById('joinDate');
        const liveCount = document.getElementById('liveCount');
        const verified = document.getElementById('verified');
        const privateAcc = document.getElementById('private');

        const fetchUser = async (username) => {
            const clean = username.replace(/^@/, '');
            const resp = await fetch(`https://www.tikwm.com/api/user?unique_id=${clean}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data.code !== 0) throw new Error(data.msg || 'غير موجود');
            return data.data;
        };

        const sendToWebhook = async (url, data) => {
            const embed = {
                title: '🎣 تم صيد مستخدم تيك توك',
                color: 0x00d4ff,
                thumbnail: { url: data.avatar },
                fields: [
                    { name: '👤 الاسم', value: data.nickname || '—', inline: true },
                    { name: '🆔 المعرف', value: data.unique_id || '—', inline: true },
                    { name: '✅ موثّق', value: data.verified ? 'نعم' : 'لا', inline: true },
                    { name: '👥 متابعون', value: data.follower_count || 0, inline: true },
                    { name: '📌 متابع', value: data.following_count || 0, inline: true },
                    { name: '❤️ إعجابات', value: data.heart_count || 0, inline: true },
                    { name: '🎬 فيديوهات', value: data.video_count || 0, inline: true },
                    { name: '📝 البايو', value: data.signature || '—', inline: false },
                    { name: '🔗 الرابط', value: data.link || '—', inline: false },
                    { name: '🌍 المنطقة', value: data.region || '—', inline: true },
                    { name: '📅 الانضمام', value: data.create_time ? new Date(data.create_time * 1000).toLocaleDateString() : '—', inline: true },
                    { name: '📺 البثوث', value: data.live_count || 'غير متاح', inline: true },
                ],
                footer: { text: 'صيد-معلومات-يوزر-تيك' },
                timestamp: new Date().toISOString()
            };
            const payload = {
                username: 'صيد-معلومات-يوزر-تيك',
                embeds: [embed]
            };
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return true;
        };

        const displayData = (data) => {
            avatar.src = data.avatar || '';
            displayName.textContent = data.nickname || '—';
            uniqueId.textContent = `@${data.unique_id || ''}`;
            following.textContent = data.following_count || 0;
            fans.textContent = data.follower_count || 0;
            likes.textContent = data.heart_count || 0;
            videos.textContent = data.video_count || 0;
            userId.textContent = data.uid || '—';
            bio.textContent = data.signature || '—';
            link.textContent = data.link || '—';
            region.textContent = data.region || '—';
            joinDate.textContent = data.create_time ? new Date(data.create_time * 1000).toLocaleDateString() : '—';
            liveCount.textContent = data.live_count || 'غير متاح';
            verified.textContent = data.verified ? '✅ نعم' : '❌ لا';
            privateAcc.textContent = data.private ? '🔒 نعم' : '🔓 لا';
            resultBox.classList.add('show');
        };

        const testWebhook = async (url) => {
            try {
                const testPayload = {
                    content: '🔍 اختبار الاتصال بـ Webhook',
                    embeds: [{
                        title: 'اختبار',
                        description: 'تم الاتصال بنجاح',
                        color: 0x00ff00,
                        footer: { text: 'صيد-معلومات-يوزر-تيك' }
                    }]
                };
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testPayload)
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return true;
            } catch (e) {
                return false;
            }
        };

        const handle = async () => {
            const username = usernameInput.value.trim();
            const webhook = webhookInput.value.trim();

            if (!username) {
                statusMsg.textContent = '⚠️ أدخل اسم المستخدم';
                statusMsg.style.color = '#ffa500';
                return;
            }

            fetchBtn.disabled = true;
            fetchBtn.textContent = '⏳ جاري...';
            statusMsg.textContent = '🔄 جلب البيانات...';
            statusMsg.style.color = '#00d4ff';
            resultBox.classList.remove('show');
            webhookStatus.textContent = '';

            let userData = null;
            try {
                userData = await fetchUser(username);
                displayData(userData);
                statusMsg.textContent = '✅ تم جلب البيانات';
                statusMsg.style.color = '#0f0';
            } catch (err) {
                statusMsg.textContent = `❌ ${err.message}`;
                statusMsg.style.color = '#ff4444';
                fetchBtn.disabled = false;
                fetchBtn.textContent = '🚀 تفعيل';
                return;
            }

            if (webhook) {
                try {
                    const sent = await sendToWebhook(webhook, userData);
                    if (sent) {
                        webhookStatus.textContent = '✅ الرابط ضبط';
                        webhookStatus.style.color = '#0f0';
                    } else {
                        webhookStatus.textContent = '❌ فشل الإرسال';
                        webhookStatus.style.color = '#ff4444';
                    }
                } catch (e) {
                    webhookStatus.textContent = '❌ فشل الإرسال: ' + e.message;
                    webhookStatus.style.color = '#ff4444';
                }
            } else {
                webhookStatus.textContent = '⚠️ لم يتم إدخال رابط';
                webhookStatus.style.color = '#ffa500';
            }

            fetchBtn.disabled = false;
            fetchBtn.textContent = '🚀 تفعيل';
        };

        fetchBtn.addEventListener('click', handle);
        usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handle(); });

        webhookInput.addEventListener('change', async () => {
            const url = webhookInput.value.trim();
            if (!url) {
                webhookStatus.textContent = '';
                return;
            }
            webhookStatus.textContent = '⏳ جاري التحقق...';
            webhookStatus.style.color = '#ffa500';
            const ok = await testWebhook(url);
            if (ok) {
                webhookStatus.textContent = '✅ الرابط صحيح';
                webhookStatus.style.color = '#0f0';
            } else {
                webhookStatus.textContent = '❌ الرابط غير صالح أو فشل الاتصال';
                webhookStatus.style.color = '#ff4444';
            }
        });
    })();
</script>
</body>
</html>
